<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">픽업 구간 측면도 — 스토퍼와 감지</text>

  <!-- 벨트 (z 0.74~0.80) -->
  <rect x="40" y="155" width="250" height="15" fill="#9ca3af" stroke="#4b5563"/>
  <text x="165" y="193" text-anchor="middle" font-size="12.5" fill="#4b5563">벨트 상면 z=800 · → 0.5 m/s (정지 가능)</text>

  <!-- 박스 5호 (X 9.52~10.0, z 0.8~1.14) -->
  <rect x="120" y="70" width="120" height="85" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/>
  <text x="180" y="118" text-anchor="middle" font-size="12" fill="#92400e">5호 (480×340)</text>

  <!-- 파지점 -->
  <circle cx="180" cy="70" r="5" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="173" y1="70" x2="187" y2="70" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="180" y1="63" x2="180" y2="77" stroke="#dc2626" stroke-width="1.6"/>
  <text x="180" y="50" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">파지점 = 상면 중심 (X 9760)</text>

  <!-- 박스 높이 치수 -->
  <g stroke="#6b7280" stroke-width="1">
    <line x1="252" y1="70" x2="252" y2="155"/>
    <line x1="247" y1="70" x2="257" y2="70"/><line x1="247" y1="155" x2="257" y2="155"/>
  </g>
  <text x="260" y="116" font-size="11.5" fill="#6b7280">340</text>

  <!-- 스토퍼 (X 10.0~10.1, z 0.8~1.1) -->
  <rect x="290" y="80" width="25" height="75" fill="#dc2626"/>
  <text x="325" y="98" font-size="12.5" fill="#b91c1c" font-weight="bold">스토퍼 X=10000</text>
  <text x="325" y="115" font-size="12" fill="#b91c1c">Collider만! (Rigid Body 금지)</text>
  <text x="325" y="132" font-size="11.5" fill="#6b7280">z 800~1100 (높이 300)</text>

  <!-- 감지선 -->
  <line x1="275" y1="62" x2="275" y2="175" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="275" y="230" text-anchor="middle" font-size="12.5" fill="#1d4ed8" font-weight="bold">감지선 = 스토퍼 − 60mm</text>
  <text x="275" y="248" text-anchor="middle" font-size="12" fill="#1d4ed8">박스 앞면이 이 안쪽 그리고 |vx| &lt; 0.01 m/s → present=true</text>
</svg>
