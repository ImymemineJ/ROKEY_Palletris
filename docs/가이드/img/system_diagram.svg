<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="mo" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1560" height="960" fill="#ffffff"/>
  <text x="780" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">시스템 구성도 — stage 1 · 모든 인터페이스와 1사이클 순서 (①~⑨)</text>

  <!-- ═══════════ PC1 ═══════════ -->
  <rect x="40" y="60" width="880" height="660" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="60" y="88" font-size="16" font-weight="bold" fill="#0f172a">PC1 · 10.10.0.1 — Isaac 머신 (GPU)</text>

  <!-- Isaac 프로세스 -->
  <rect x="60" y="104" width="340" height="586" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="80" y="128" font-size="14" font-weight="bold" fill="#9a3412">Isaac 프로세스 — python.sh (3.11) · "몸"</text>
  <text x="80" y="146" font-size="11.5" fill="#b45309">★ import rclpy 금지 — socket + json 표준 라이브러리만</text>

  <rect x="80" y="165" width="300" height="80" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="95" y="186" font-size="12.5" font-weight="bold" fill="#111827">World · 물리 · 씬 — 김학민</text>
  <text x="95" y="204" font-size="11.5" fill="#374151">spawner (per-box 물리) · 스토퍼 감시</text>
  <text x="95" y="220" font-size="11.5" fill="#374151">벨트 velocity (OmniGraph) · 팔레트 교체</text>

  <rect x="80" y="262" width="300" height="66" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="95" y="283" font-size="12.5" font-weight="bold" fill="#111827">robot_motion.py — 김병직</text>
  <text x="95" y="301" font-size="11.5" fill="#374151">Lula IK · SurfaceGripper (grasp/release)</text>
  <text x="95" y="317" font-size="11.5" fill="#374151">논블로킹 move_ee (매 스텝 조금씩)</text>

  <rect x="80" y="348" width="300" height="52" rx="6" fill="none" stroke="#9ca3af" stroke-dasharray="5,4"/>
  <text x="95" y="369" font-size="11.5" fill="#6b7280">메인 루프 60Hz:</text>
  <text x="95" y="386" font-size="11.5" fill="#6b7280">world.step → srv.poll() → on_step()</text>

  <rect x="80" y="470" width="300" height="100" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="95" y="493" font-size="13" font-weight="bold" fill="#9a3412">sim_server.py — 김학민</text>
  <text x="95" y="512" font-size="11.5" fill="#7c2d12">JSON 명령 디스패처 · localhost:8765</text>
  <text x="95" y="529" font-size="11.5" fill="#7c2d12">클라이언트 2개 동시 수용 (필수!)</text>
  <text x="95" y="546" font-size="11.5" fill="#7c2d12">핸들러는 절대 블로킹하지 않는다</text>

  <text x="230" y="672" text-anchor="middle" font-size="11" fill="#9a3412">박스 prim = /World/boxes/&lt;box_id&gt;</text>

  <!-- ROS 프로세스 -->
  <rect x="560" y="104" width="340" height="586" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="580" y="128" font-size="14" font-weight="bold" fill="#1e3a8a">ROS 프로세스 — python 3.12 · "머리"</text>
  <text x="580" y="146" font-size="11.5" fill="#1d4ed8">다른 PC에는 이 노드 2개만 보인다</text>

  <rect x="580" y="165" width="300" height="112" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="595" y="187" font-size="12.5" font-weight="bold" fill="#111827">sim_bridge_node — 김학민</text>
  <text x="595" y="205" font-size="11.5" fill="#374151">ROS 서비스·토픽 ↔ JSON 소켓 변환</text>
  <text x="595" y="221" font-size="11.5" fill="#374151">스폰 스케줄러 12s (seed 42, 15개)</text>
  <text x="595" y="237" font-size="11.5" fill="#374151">pickup_check 5Hz 폴링 → 토픽 발행</text>
  <text x="595" y="253" font-size="11.5" fill="#374151">entry: ros2 run packing_sim sim_bridge_node</text>

  <rect x="580" y="420" width="300" height="150" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="595" y="443" font-size="12.5" font-weight="bold" fill="#111827">orchestrator — 김병직</text>
  <text x="595" y="461" font-size="11.5" fill="#374151">pick&amp;place 상태머신 17상태 + FAIL 경로</text>
  <text x="595" y="477" font-size="11.5" fill="#374151">MultiThreadedExecutor · call_async만</text>
  <text x="595" y="493" font-size="11.5" fill="#374151">모든 실패 경로에서 /algo/cancel_plan</text>
  <text x="595" y="509" font-size="11.5" fill="#374151">타임아웃 2s → BLOCKED + 벨트 재가동</text>
  <text x="595" y="525" font-size="11.5" fill="#374151">/zone_b/status 발행 2Hz (fill_rate 포함)</text>

  <!-- PC1 내부: 소켓 (주황) -->
  <line x1="380" y1="485" x2="580" y2="225" stroke="#ea580c" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="580" y1="235" x2="380" y2="495" stroke="#ea580c" stroke-width="1" stroke-dasharray="2,3"/>
  <rect x="382" y="219" width="196" height="84" fill="#ffffff" opacity="0.9"/>
  <text x="480" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a3412">소켓 — A 명령</text>
  <text x="480" y="247" text-anchor="middle" font-size="10.5" fill="#7c2d12">① spawn_box · spawn_status</text>
  <text x="480" y="263" text-anchor="middle" font-size="10.5" fill="#7c2d12">pickup_check · set_velocity</text>
  <text x="480" y="279" text-anchor="middle" font-size="10.5" fill="#7c2d12">swap_pallet · despawn_box</text>
  <text x="480" y="295" text-anchor="middle" font-size="10.5" fill="#7c2d12">set_spawn_enabled · get_box_pose</text>

  <line x1="380" y1="552" x2="580" y2="538" stroke="#ea580c" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="580" y1="548" x2="380" y2="562" stroke="#ea580c" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="480" y="440" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a3412">소켓 — B 명령</text>
  <text x="480" y="457" text-anchor="middle" font-size="10.5" fill="#7c2d12">⑦ move_ee · motion_status</text>
  <text x="480" y="473" text-anchor="middle" font-size="10.5" fill="#7c2d12">grasp · release · is_holding</text>
  <text x="480" y="489" text-anchor="middle" font-size="10.5" fill="#7c2d12">tcp_speed</text>

  <!-- PC1 내부: BR ↔ ORC (ROS) -->
  <line x1="640" y1="277" x2="640" y2="420" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <text x="650" y="298" font-size="11" fill="#15803d">③ /zone_b/box_at_pickup</text>
  <line x1="835" y1="420" x2="835" y2="277" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mb)"/>
  <text x="825" y="360" text-anchor="end" font-size="11" fill="#1d4ed8">④ /conveyor/set_velocity</text>
  <text x="825" y="375" text-anchor="end" font-size="11" fill="#1d4ed8">/sim/swap_pallet</text>
  <text x="825" y="390" text-anchor="end" font-size="11" fill="#1d4ed8">/sim/set_spawn_enabled</text>

  <!-- ═══════════ PC2 ═══════════ -->
  <rect x="1040" y="60" width="480" height="270" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="1060" y="88" font-size="16" font-weight="bold" fill="#14532d">PC2 · 10.10.0.2 — DB</text>
  <rect x="1060" y="104" width="300" height="128" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="1075" y="126" font-size="12.5" font-weight="bold" fill="#111827">db_service_node — 민범진</text>
  <text x="1075" y="144" font-size="11.5" fill="#374151">★ 유일한 DB writer (다른 노드 직접 접근 금지)</text>
  <text x="1075" y="160" font-size="11.5" fill="#374151">spawn_event 수신 → SPAWNED…DIVERTED 자동</text>
  <text x="1075" y="176" font-size="11.5" fill="#374151">box_events에 모든 전이 기록 (지표의 원천)</text>
  <text x="1075" y="192" font-size="11.5" fill="#374151">/metrics/summary 1Hz 발행</text>
  <text x="1075" y="208" font-size="11.5" fill="#374151">+ mock_all (전 서비스 Mock, Day1)</text>
  <ellipse cx="1445" cy="120" rx="55" ry="14" fill="#e5e7eb" stroke="#6b7280"/>
  <rect x="1390" y="120" width="110" height="70" fill="#e5e7eb" stroke="#6b7280"/>
  <ellipse cx="1445" cy="190" rx="55" ry="14" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="1445" y="152" text-anchor="middle" font-size="10.5" fill="#374151">~/palletris_ws/</text>
  <text x="1445" y="167" text-anchor="middle" font-size="10.5" fill="#374151">packing.db</text>
  <line x1="1360" y1="168" x2="1390" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1060" y="258" font-size="11" fill="#166534" font-weight="bold">제공 서비스:  /db/get_box_info ⑤ · /db/set_status · /db/mark_placed ⑨</text>
  <text x="1060" y="276" font-size="11" fill="#166534">/db/zone_queue · /db/register_box · /db/verify_box · /diverter/request(2차)</text>
  <text x="1060" y="300" font-size="11" fill="#374151">구독:  /sim/spawn_event ② · /zone_b/status (fill_rate 캐시)</text>

  <!-- ═══════════ PC3 ═══════════ -->
  <rect x="1040" y="360" width="480" height="180" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1060" y="388" font-size="16" font-weight="bold" fill="#4c1d95">PC3 · 10.10.0.3 — 패킹 알고리즘</text>
  <rect x="1060" y="402" width="300" height="88" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1075" y="424" font-size="12.5" font-weight="bold" fill="#111827">algo_service_node — 정정인</text>
  <text x="1075" y="442" font-size="11.5" fill="#374151">HeightmapPacker · 80×120 셀 (10mm)</text>
  <text x="1075" y="458" font-size="11.5" fill="#374151">높이+지지율 점수 · 수직 통로 검사</text>
  <text x="1075" y="474" font-size="11.5" fill="#374151">plan 응답 200ms 이내</text>
  <g stroke="#7c3aed" fill="none">
    <rect x="1400" y="410" width="66" height="66"/>
    <line x1="1422" y1="410" x2="1422" y2="476"/><line x1="1444" y1="410" x2="1444" y2="476"/>
    <line x1="1400" y1="432" x2="1466" y2="432"/><line x1="1400" y1="454" x2="1466" y2="454"/>
  </g>
  <rect x="1400" y="454" width="22" height="22" fill="#ddd6fe"/>
  <rect x="1422" y="432" width="22" height="44" fill="#c4b5fd"/>
  <text x="1060" y="514" font-size="11" fill="#4c1d95" font-weight="bold">제공 서비스:  /algo/plan_placement ⑥ · /algo/update_heightmap ⑧</text>
  <text x="1060" y="531" font-size="11" fill="#4c1d95">/algo/cancel_plan (실패 시 필수) · /algo/reset (팔레트 교체 후)</text>

  <!-- ═══════════ PC4 ═══════════ -->
  <rect x="1040" y="570" width="480" height="150" rx="10" fill="#fafaf9" stroke="#57534e" stroke-width="2"/>
  <text x="1060" y="598" font-size="16" font-weight="bold" fill="#44403c">PC4 · 10.10.0.4 — 모니터링</text>
  <text x="1060" y="626" font-size="11.5" fill="#374151">ros2 topic echo /metrics/summary · rqt</text>
  <text x="1060" y="644" font-size="11.5" fill="#374151">통합 디버깅 만능 창:</text>
  <text x="1060" y="662" font-size="11" fill="#6b7280" font-family="monospace">SELECT box_id,status,ts FROM box_events</text>
  <text x="1060" y="678" font-size="11" fill="#6b7280" font-family="monospace">ORDER BY ts DESC LIMIT 20;</text>

  <!-- ═══════════ PC 간 화살표 ═══════════ -->
  <!-- ② spawn_event -->
  <line x1="880" y1="200" x2="1060" y2="145" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <rect x="898" y="145" width="142" height="17" fill="#ffffff" opacity="0.9"/>
  <text x="968" y="158" text-anchor="middle" font-size="11" fill="#15803d">② /sim/spawn_event</text>
  <!-- ⑤⑨ db 서비스 -->
  <line x1="880" y1="450" x2="1060" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <rect x="918" y="292" width="134" height="17" fill="#ffffff" opacity="0.9"/>
  <text x="985" y="305" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">⑤⑨ /db/* 서비스</text>
  <!-- status 토픽 -->
  <line x1="880" y1="480" x2="1060" y2="315" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <rect x="918" y="385" width="144" height="17" fill="#ffffff" opacity="0.9"/>
  <text x="990" y="398" text-anchor="middle" font-size="11" fill="#15803d">/zone_b/status 2Hz</text>
  <!-- ⑥⑧ algo -->
  <line x1="880" y1="510" x2="1060" y2="440" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <rect x="900" y="477" width="140" height="17" fill="#ffffff" opacity="0.9"/>
  <text x="970" y="490" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">⑥⑧ /algo/* 서비스</text>
  <!-- metrics 우회 라우팅 -->
  <path d="M 1520 250 L 1544 250 L 1544 640 L 1524 640" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <text x="1538" y="238" text-anchor="end" font-size="11" fill="#15803d">/metrics/summary 1Hz</text>

  <!-- ═══════════ 범례 + 핵심 계약 ═══════════ -->
  <rect x="40" y="742" width="880" height="178" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="60" y="768" font-size="13" font-weight="bold" fill="#111827">범례</text>
  <line x1="60" y1="788" x2="130" y2="788" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <text x="140" y="792" font-size="11.5" fill="#374151">ROS 서비스 — 요청→응답 · 타임아웃 2.0s · 실패 시 BLOCKED+재가동</text>
  <line x1="60" y1="812" x2="130" y2="812" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mg)"/>
  <text x="140" y="816" font-size="11.5" fill="#374151">ROS 토픽 — 발행→구독</text>
  <line x1="60" y1="836" x2="130" y2="836" stroke="#ea580c" stroke-width="2" marker-end="url(#mo)"/>
  <text x="140" y="840" font-size="11.5" fill="#374151">JSON 소켓 — PC1 내부 전용 (localhost:8765 · 개행 JSON · 요청-응답만)</text>
  <text x="60" y="870" font-size="11.5" fill="#111827" font-weight="bold">①~⑨ = 1사이클 순서:</text>
  <text x="60" y="889" font-size="11" fill="#374151">① 스폰 → ② DB 등록(SPAWNED→DIVERTED) → ③ 도착 알림 → ④ 벨트 정지 → ⑤ 크기 조회(순서 아닌 ID로!)</text>
  <text x="60" y="906" font-size="11" fill="#374151">→ ⑥ 배치 계산 → ⑦ 파지·이송·release(소켓) → ⑧ 실측 pose로 갱신 → ⑨ 적재 기록 → ④' 벨트 재가동</text>

  <rect x="940" y="742" width="580" height="178" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="960" y="768" font-size="13" font-weight="bold" fill="#991b1b">핵심 계약 — 어기면 통합이 깨진다</text>
  <text x="960" y="792" font-size="11.5" fill="#7f1d1d">· packing.db는 db_service_node만 연다 (락 경합 방지)</text>
  <text x="960" y="812" font-size="11.5" fill="#7f1d1d">· 어떤 콜백(타이머 포함)에서도 spin_until_future_complete 금지</text>
  <text x="960" y="832" font-size="11.5" fill="#7f1d1d">· 단위: DB·config = mm 정수 / 코드 = m / heightmap = 셀(10mm)</text>
  <text x="960" y="852" font-size="11.5" fill="#7f1d1d">· PlacePose: x,y = 박스 중심 · z = 박스 밑면 / yaw0 = size_w가 +X</text>
  <text x="960" y="872" font-size="11.5" fill="#7f1d1d">· 팔레트 원점(B) = 월드 (11200, −600, 150) · max_stack 850</text>
  <text x="960" y="892" font-size="11.5" fill="#7f1d1d">· Isaac 프로세스에 rclpy 금지 (py3.11 vs 3.12 ABI)</text>

  <text x="780" y="948" text-anchor="middle" font-size="11.5" fill="#6b7280">네트워크: 유선 2.5G 스위치 · 10.10.0.1~4 · ROS_DOMAIN_ID=115 · FastDDS 유선 whitelist — 통신이 안 보이면 G6부터 재확인</text>
</svg>
