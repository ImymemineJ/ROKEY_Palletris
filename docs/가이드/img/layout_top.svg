<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 330" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1250" height="330" fill="#ffffff"/>
  <text x="625" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">stage 1 (B구역) 평면도 — 위에서 본 모습 (좌표 단위: mm)</text>

  <!-- 축 표시 -->
  <g stroke="#374151" stroke-width="1.6" fill="#374151">
    <line x1="70" y1="70" x2="112" y2="70"/><polygon points="112,70 104,66 104,74"/>
    <line x1="70" y1="70" x2="70" y2="46"/><polygon points="70,46 66,54 74,54"/>
  </g>
  <text x="118" y="74" font-size="13" fill="#374151">+X (진행)</text>
  <text x="60" y="40" font-size="13" fill="#374151">+Y</text>

  <!-- 메인 벨트 X 0~7500 -->
  <rect x="55" y="158.5" width="675" height="63" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <!-- 픽업 벨트 X 7500~10000 -->
  <rect x="730" y="158.5" width="225" height="63" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="730" y1="128" x2="730" y2="248" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="820" y="146" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="bold">픽업 벨트 (별도 그래프)</text>

  <!-- 스폰 지점 -->
  <circle cx="100" cy="190" r="6" fill="#16a34a"/>
  <text x="100" y="243" text-anchor="middle" font-size="12.5" fill="#15803d">스폰 (500, 0, 810)</text>

  <!-- 대기열 박스 3개 -->
  <g fill="#fcd34d" stroke="#b45309" stroke-width="1.2">
    <rect x="912" y="173" width="43" height="34"/>
    <rect x="866" y="173" width="43" height="34"/>
    <rect x="820" y="173" width="43" height="34"/>
  </g>
  <text x="800" y="240" text-anchor="middle" font-size="12.5" fill="#92400e">대기열 (버퍼 4)</text>

  <!-- 스토퍼 -->
  <rect x="955" y="152" width="9" height="76" fill="#dc2626"/>
  <text x="947" y="243" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="bold">스토퍼 X=10000</text>

  <!-- 페데스탈 + 로봇 -->
  <rect x="1022.5" y="176.5" width="27" height="27" fill="#9ca3af" stroke="#4b5563"/>
  <circle cx="1036" cy="190" r="8" fill="#374151"/>
  <text x="1036" y="106" text-anchor="middle" font-size="12.5" fill="#111827" font-weight="bold">로봇 베이스</text>
  <text x="1036" y="121" text-anchor="middle" font-size="12" fill="#111827">(10900, 0, 700)</text>
  <line x1="1036" y1="126" x2="1036" y2="172" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 팔레트 -->
  <rect x="982" y="91" width="108" height="72" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.6"/>
  <text x="1036" y="120" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">팔레트</text>
  <text x="1036" y="135" text-anchor="middle" font-size="11.5" fill="#166534">1200(Px)×800(Py)</text>

  <!-- 팔레트 원점 + Px/Py -->
  <circle cx="982" cy="163" r="4.5" fill="#dc2626"/>
  <g stroke="#dc2626" stroke-width="1.6" fill="#dc2626">
    <line x1="982" y1="163" x2="1019" y2="163"/><polygon points="1019,163 1012,160 1012,166"/>
    <line x1="982" y1="163" x2="982" y2="131"/><polygon points="982,131 979,138 985,138"/>
  </g>
  <text x="1024" y="167" font-size="11.5" fill="#dc2626" font-weight="bold">Px</text>
  <text x="968" y="131" font-size="11.5" fill="#dc2626" font-weight="bold">Py</text>
  <text x="900" y="182" font-size="12.5" fill="#b91c1c">원점 (10300, 300, 150)</text>
  <text x="900" y="197" font-size="11" fill="#b91c1c">★ 셀 90° 회전 — 팔레트가 로봇 **정면(+Y)**</text>

  <!-- 치수선 -->
  <g stroke="#6b7280" stroke-width="1">
    <line x1="55" y1="285" x2="730" y2="285"/>
    <line x1="55" y1="280" x2="55" y2="290"/><line x1="730" y1="280" x2="730" y2="290"/>
    <line x1="730" y1="285" x2="955" y2="285"/>
    <line x1="955" y1="280" x2="955" y2="290"/>
  </g>
  <text x="392" y="279" text-anchor="middle" font-size="12.5" fill="#374151">메인 벨트 7500</text>
  <text x="842" y="279" text-anchor="middle" font-size="12.5" fill="#374151">픽업 구간 2500</text>
  <text x="55" y="305" text-anchor="middle" font-size="11.5" fill="#6b7280">X=0</text>
  <text x="730" y="305" text-anchor="middle" font-size="11.5" fill="#6b7280">7500</text>
  <text x="955" y="305" text-anchor="middle" font-size="11.5" fill="#6b7280">10000</text>
</svg>
