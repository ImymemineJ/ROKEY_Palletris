<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">팔레트 좌표계 — PlacePose 계약 (김병직·정정인 필수 합의)</text>

  <!-- ===== 왼쪽: 평면 (Px, Py) ===== -->
  <text x="70" y="50" font-size="14" font-weight="bold" fill="#374151">① 평면 — x_mm, y_mm는 박스 "중심"</text>
  <rect x="70" y="166" width="300" height="200" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="220" y="186" text-anchor="middle" font-size="11.5" fill="#166534">팔레트 1200(Px) × 800(Py)</text>

  <!-- 박스 (4호, yaw=0) — 원점 화살표를 가리지 않게 중단부에 배치 -->
  <rect x="120" y="251" width="102.5" height="77.5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="171" cy="290" r="4.5" fill="#7c2d12"/>
  <line x1="162" y1="290" x2="180" y2="290" stroke="#7c2d12" stroke-width="1.4"/>
  <line x1="171" y1="281" x2="171" y2="299" stroke="#7c2d12" stroke-width="1.4"/>
  <line x1="171" y1="286" x2="200" y2="238" stroke="#7c2d12" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="205" y="228" font-size="12.5" fill="#7c2d12" font-weight="bold">(x_mm, y_mm)</text>
  <text x="205" y="244" font-size="12" fill="#7c2d12">= 박스 중심 좌표</text>

  <!-- 원점 (박스보다 나중에 그려 항상 보이게) -->
  <circle cx="70" cy="366" r="5" fill="#dc2626"/>
  <text x="70" y="394" font-size="12.5" fill="#b91c1c" font-weight="bold">원점(모서리) = 월드 (10300, 300, 150)</text>
  <g stroke="#dc2626" stroke-width="1.8" fill="#dc2626">
    <line x1="70" y1="366" x2="135" y2="366"/><polygon points="135,366 127,362 127,370"/>
    <line x1="70" y1="366" x2="70" y2="301"/><polygon points="70,301 66,309 74,309"/>
  </g>
  <text x="140" y="371" font-size="12" fill="#dc2626" font-weight="bold">Px → 월드 +X</text>
  <text x="78" y="302" font-size="12" fill="#dc2626" font-weight="bold">Py → 월드 +Y</text>

  <!-- yaw 인셋 -->
  <text x="300" y="110" font-size="13" font-weight="bold" fill="#374151">yaw 의미</text>
  <rect x="300" y="122" width="82" height="62" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="392" y="152" font-size="12" fill="#374151">yaw=0</text>
  <text x="392" y="168" font-size="11" fill="#6b7280">size_w가 Px</text>
  <rect x="300" y="204" width="62" height="82" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="372" y="240" font-size="12" fill="#374151">yaw=90</text>
  <text x="372" y="256" font-size="11" fill="#6b7280">size_d가 Px</text>

  <!-- ===== 오른쪽: 측면 (z) ===== -->
  <text x="480" y="50" font-size="14" font-weight="bold" fill="#374151">② 측면 — z_mm는 박스 "밑면" (중심 아님!)</text>
  <!-- 팔레트 슬랩 -->
  <rect x="480" y="366" width="310" height="37.5" fill="#86efac" stroke="#16a34a"/>
  <text x="550" y="390" text-anchor="middle" font-size="11.5" fill="#166534">팔레트 두께 150 (상면 = Pz 0 = 월드 z 150)</text>
  <!-- 1층 박스 -->
  <rect x="505" y="313.5" width="85" height="52.5" fill="#fde68a" stroke="#b45309"/>
  <text x="547" y="344" text-anchor="middle" font-size="11" fill="#92400e">1층 (z_mm=0)</text>
  <!-- 2층 박스 -->
  <rect x="505" y="261" width="85" height="52.5" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <!-- z_mm 화살표: 2층 밑면 -->
  <line x1="700" y1="313.5" x2="592" y2="313.5" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="705" y="317" font-size="12.5" fill="#1d4ed8" font-weight="bold">z_mm = 밑면 (=210)</text>
  <!-- 중심 -->
  <circle cx="547.5" cy="287.25" r="4" fill="#1e3a8a"/>
  <line x1="700" y1="287.25" x2="553" y2="287.25" stroke="#1e3a8a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="705" y="290" font-size="12.5" fill="#1e3a8a">중심 z = z_mm + h/2</text>
  <text x="705" y="306" font-size="11.5" fill="#6b7280">변환은 frames.py만 사용</text>

  <!-- h/2 누락 유령 박스 -->
  <rect x="620" y="329" width="85" height="52.5" fill="#fecaca" fill-opacity="0.75" stroke="#dc2626" stroke-dasharray="4,3"/>
  <text x="662" y="425" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="bold">❌ h/2 누락 → 반쯤 파묻힘 (함정 #11)</text>
</svg>
