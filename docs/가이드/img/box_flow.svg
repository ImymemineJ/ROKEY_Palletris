<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1290" width="980" height="1290" role="img" aria-label="박스 한 개 처리 플로우 — 스폰부터 트럭 상차까지">
  <title>박스 처리 플로우 (2026-08-27 구현 실측 기준)</title>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  </style>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f8f9a"/>
    </marker>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4ab93"/>
    </marker>
  </defs>

  <!-- 배경 — 다크 모드에서도 글씨가 보이게 흰 바탕을 깐다 -->
  <rect x="0" y="0" width="980" height="1290" fill="#ffffff"/>

  <!-- 메인 세로 화살표 -->
  <g stroke="#8f8f9a" stroke-width="2">
    <line x1="490" y1="128" x2="490" y2="156" marker-end="url(#fa)"/>
    <line x1="490" y1="248" x2="490" y2="276" marker-end="url(#fa)"/>
    <line x1="490" y1="368" x2="490" y2="396" marker-end="url(#fa)"/>
    <line x1="490" y1="488" x2="490" y2="516" marker-end="url(#fa)"/>
    <line x1="490" y1="608" x2="490" y2="636" marker-end="url(#fa)"/>
    <line x1="490" y1="728" x2="490" y2="756" marker-end="url(#fa)"/>
    <line x1="490" y1="848" x2="490" y2="876" marker-end="url(#fa)"/>
    <line x1="490" y1="968" x2="490" y2="996" marker-end="url(#fa)"/>
  </g>

  <!-- 메인 상자들 -->
  <g>
    <rect x="280" y="36" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="75" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">박스 스폰</text>
    <text x="490" y="103" text-anchor="middle" font-size="13.5" fill="#6a63b8">시뮬레이터 · 랜덤 y ±150 · yaw ±15°</text>

    <rect x="280" y="156" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="195" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">QR 인식 · 크기 판정</text>
    <text x="490" y="223" text-anchor="middle" font-size="13.5" fill="#6a63b8">라인 카메라 1 · RGB–깊이 교차검증 · DB 등록</text>

    <rect x="280" y="276" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="315" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">ID 검증</text>
    <text x="490" y="343" text-anchor="middle" font-size="13.5" fill="#6a63b8">라인 카메라 2 · 등록값 재판독 대조</text>

    <rect x="280" y="396" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="435" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">목적지 판단 · 구역 분기</text>
    <text x="490" y="463" text-anchor="middle" font-size="13.5" fill="#6a63b8">중재자 · 주소→동→구역 · A · B · C</text>

    <rect x="280" y="516" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="555" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">픽업 위치 도착</text>
    <text x="490" y="583" text-anchor="middle" font-size="13.5" fill="#6a63b8">천장 카메라 · 스토퍼 정지 감지</text>

    <rect x="280" y="636" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="675" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">벨트 정지 · 자리 계산</text>
    <text x="490" y="703" text-anchor="middle" font-size="13.5" fill="#6a63b8">관제탑 · 적재 알고리즘 (높이맵)</text>

    <rect x="280" y="756" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="795" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">집기 · 놓기 · 높이맵 갱신</text>
    <text x="490" y="823" text-anchor="middle" font-size="13.5" fill="#6a63b8">로봇 · 알고리즘 — 실측 pose 로 갱신 (자기교정)</text>

    <rect x="280" y="876" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="915" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">팔레트 만재</text>
    <text x="490" y="943" text-anchor="middle" font-size="13.5" fill="#6a63b8">PALLET_FULL · 지표 출력 (적재수 · 충전율 · 최고높이)</text>

    <rect x="280" y="996" width="420" height="92" rx="14" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
    <text x="490" y="1035" text-anchor="middle" font-size="19.5" font-weight="700" fill="#33307e">트럭 상차</text>
    <text x="490" y="1063" text-anchor="middle" font-size="13.5" fill="#6a63b8">반출 컨베이어 → 커브 → 트럭 · 빈 팔레트 재투입</text>
  </g>

  <!-- 오른쪽 분기: 자리 없음 -->
  <line x1="700" y1="682" x2="748" y2="682" stroke="#8f8f9a" stroke-width="2" marker-end="url(#fa)"/>
  <rect x="750" y="628" width="212" height="108" rx="14" fill="#f4f1e8" stroke="#b4ab93" stroke-width="1.6"/>
  <text x="856" y="664" text-anchor="middle" font-size="15.5" font-weight="700" fill="#6e6650">NO_FEASIBLE_POSE</text>
  <text x="856" y="690" text-anchor="middle" font-size="13" fill="#8d8468">그 박스만 되돌림 · 계속</text>
  <text x="856" y="714" text-anchor="middle" font-size="13" fill="#8d8468">(PALLET_FULL 과 구분)</text>

  <!-- 왼쪽 루프: 박스마다 반복 -->
  <path d="M 280 802 H 208 V 562 H 268" fill="none" stroke="#8f8f9a" stroke-width="2" marker-end="url(#fa)"/>
  <text x="148" y="688" text-anchor="middle" font-size="14.5" fill="#6b7280">박스마다 반복</text>

  <!-- Return line (재순환) -->
  <path d="M 280 442 H 118 V 202 H 268" fill="none" stroke="#b4ab93" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fd)"/>
  <text x="118" y="330" text-anchor="middle" font-size="14.5" fill="#9a9070">Return line</text>
  <text x="118" y="352" text-anchor="middle" font-size="12.5" fill="#b0a78c">미등록 · 실패 재순환</text>

  <!-- 범례 -->
  <rect x="300" y="1140" width="26" height="18" rx="5" fill="#eceafc" stroke="#6c5fc7" stroke-width="1.8"/>
  <text x="338" y="1155" font-size="14" fill="#55555f">구현 완료 — 전 단계 (2026-08-27 실측)</text>
  <line x1="560" y1="1149" x2="600" y2="1149" stroke="#b4ab93" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="612" y="1155" font-size="14" fill="#55555f">예외 경로 (되돌림 · 재순환)</text>
</svg>
