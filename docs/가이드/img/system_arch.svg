<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 812" width="1150" height="812" role="img" aria-label="Palletris 시스템 아키텍처 — Isaac 안과 밖">
  <title>Palletris 시스템 아키텍처 (2026-08-27 구현 실측 기준)</title>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a8"/>
    </marker>
  </defs>

  <!-- 배경 — 다크 모드에서도 글씨가 보이게 흰 바탕을 깐다 -->
  <rect x="0" y="0" width="1150" height="812" fill="#ffffff"/>

  <!-- 왼쪽: Isaac 안 -->
  <rect x="40" y="60" width="470" height="600" rx="26" fill="#faf0dd" stroke="#d8b98a" stroke-width="1.6"/>
  <text x="275" y="108" text-anchor="middle" font-size="23" font-weight="700" fill="#7a4a12">Isaac Sim 안</text>
  <text x="275" y="134" text-anchor="middle" font-size="14.5" fill="#a97b3f">Action Graph + Python · 3.11</text>

  <g>
    <rect x="86" y="168" width="378" height="118" rx="14" fill="#fdf4ee" stroke="#dda78f" stroke-width="1.4"/>
    <text x="275" y="218" text-anchor="middle" font-size="19.5" font-weight="700" fill="#8a4b2f">카메라 그래프</text>
    <text x="275" y="248" text-anchor="middle" font-size="14.5" fill="#b3765a">라인 2대 · 천장 3대 (rgb + depth)</text>

    <rect x="86" y="316" width="378" height="118" rx="14" fill="#fdf4ee" stroke="#dda78f" stroke-width="1.4"/>
    <text x="275" y="366" text-anchor="middle" font-size="19.5" font-weight="700" fill="#8a4b2f">씬 제어 그래프</text>
    <text x="275" y="396" text-anchor="middle" font-size="14.5" fill="#b3765a">스폰 · 벨트 · 분기기 · 반출</text>

    <rect x="86" y="464" width="378" height="118" rx="14" fill="#fdf4ee" stroke="#dda78f" stroke-width="1.4"/>
    <text x="275" y="510" text-anchor="middle" font-size="19.5" font-weight="700" fill="#8a4b2f">로봇 제어 (Python)</text>
    <text x="275" y="540" text-anchor="middle" font-size="14.5" fill="#b3765a">Lula IK · 흡착 · 로봇 3대</text>
  </g>

  <!-- 가운데 화살표 -->
  <text x="575" y="332" text-anchor="middle" font-size="16.5" font-weight="500" fill="#6b7280">ROS 2</text>
  <line x1="528" y1="360" x2="622" y2="360" stroke="#9aa0a8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="622" y1="404" x2="528" y2="404" stroke="#9aa0a8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 오른쪽: Isaac 밖 -->
  <rect x="640" y="24" width="470" height="756" rx="26" fill="#e9f2fc" stroke="#8fb4dd" stroke-width="1.6"/>
  <text x="875" y="70" text-anchor="middle" font-size="23" font-weight="700" fill="#1c4e89">Isaac 밖 — rclpy 노드</text>
  <text x="875" y="96" text-anchor="middle" font-size="14.5" fill="#4f7fb5">Python 3.12 · 판단 로직 전부</text>

  <g font-size="18" font-weight="700" fill="#2d3a8c">
    <rect x="686" y="122" width="378" height="94" rx="14" fill="#f0eefb" stroke="#8f87d8" stroke-width="1.4"/>
    <text x="875" y="162" text-anchor="middle">라인 인식 노드 · 1개</text>
    <text x="875" y="190" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">cam1 등록 · cam2 검증 · RGB–깊이 교차검증</text>

    <rect x="686" y="228" width="378" height="94" rx="14" fill="#f0eefb" stroke="#8f87d8" stroke-width="1.4"/>
    <text x="875" y="268" text-anchor="middle">구역 인식 노드 · 3개</text>
    <text x="875" y="296" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">도착 감지 · 픽업 좌표</text>

    <rect x="686" y="334" width="378" height="94" rx="14" fill="#f0eefb" stroke="#8f87d8" stroke-width="1.4"/>
    <text x="875" y="374" text-anchor="middle">중재자 · 1개</text>
    <text x="875" y="402" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">목적지 배분 · 되돌림 판단</text>

    <rect x="686" y="440" width="378" height="94" rx="14" fill="#f0eefb" stroke="#6c63c8" stroke-width="2"/>
    <text x="875" y="480" text-anchor="middle">관제탑 · 1개</text>
    <text x="875" y="508" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">구역별 상태머신 3벌 · /robot/cmd 유일 발신자</text>

    <rect x="686" y="546" width="378" height="94" rx="14" fill="#f0eefb" stroke="#8f87d8" stroke-width="1.4"/>
    <text x="875" y="586" text-anchor="middle">적재 알고리즘 · 1개</text>
    <text x="875" y="614" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">높이맵 3장 소유 · 실측 pose 로 갱신</text>

    <rect x="686" y="652" width="378" height="94" rx="14" fill="#f0eefb" stroke="#8f87d8" stroke-width="1.4"/>
    <text x="875" y="692" text-anchor="middle">DB 서비스 · 1개</text>
    <text x="875" y="720" text-anchor="middle" font-size="13.5" font-weight="400" fill="#6a63b8">palletris.db 유일 writer · 지표 집계</text>
  </g>
</svg>
