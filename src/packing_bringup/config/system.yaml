# =============================================================================
#  모든 숫자의 단일 출처. 코드에 상수를 박지 않는다. (작업명세서 §4, 철칙 3)
#  값을 바꾸면 PR 설명에 "바꾼 키와 이유" 를 반드시 적는다.
# =============================================================================
stage: 1                       # 1 = B구역 단독(Day1~3) / 2 = 3구역(Day4~)

boxes:
  types:
    # 치수·질량·혼입비율 = 구 사양서 §4-1 · §4-3 (2026-08-22 기준 통일)
    #   질량은 화물 밀도 150 kg/m³ 가정에서 유도. 흡착 상한 10 kg (§4-4) 안.
    #   ※ 5호 깊이는 380 이 맞다 — 실제 우체국 규격. 구 사양서 §4-1 의 360 은 오타다
    #      (같은 표의 부피 58.8 L 가 360 으로 계산된 값. 380 이면 62.0 L).
    - {name: "3호", w_mm: 340, d_mm: 250, h_mm: 210, mass_g: 3000}
    - {name: "4호", w_mm: 410, d_mm: 310, h_mm: 280, mass_g: 5000}
    - {name: "5호", w_mm: 480, d_mm: 380, h_mm: 340, mass_g: 9000}
  size_distribution: [0.5, 0.3, 0.2]         # 소형이 많은 실제 택배 분포 (§4-3)
  random_seed: 42                            # 고정 — 베이스라인 비교 필수
  spawn_yaw_deg: 0
  stage1: {spawn_interval_s: 12.0, total_count: 15, zone: "B",
           zone_bias: {A: 0.0, B: 1.0, C: 0.0}}
  stage2: {spawn_interval_s: 4.0, total_count: 45}

run_profile: "packing"         # "packing" | "coordination"
profiles:
  packing:      {zone_bias: {A: 0.334, B: 0.333, C: 0.333}, arbiter_enabled: false}
  coordination: {zone_bias: {A: 0.6,   B: 0.2,   C: 0.2},   arbiter_enabled: true}

zones:
  list: ["A", "B", "C"]
  buffer_capacity: 4
  # ★ 2026-08-22 셀 90도 회전 확정. 팔레트가 로봇 **정면(+Y)** 쪽으로 왔다.
  #   이유: 존이 늘어선 방향(Y)으로 팔레트가 800 이어야 3개 붙여 2400 mm 가 되고
  #   그래야 트럭 바닥 2800 에 들어간다 (구 사양서 5-2). 이전 배치는 1200 x 3 = 3600 으로 초과였다.
  #   ⚠ 팔레트만 돌리면 최원점이 1902 mm 로 도달범위(1700)를 넘는다. 로봇이 팔레트의
  #     **긴 변(1200) 바깥에 300 이격**해 서야 1667 mm 가 된다 (구 사양서 3-1 "장변 중앙 이격 300").
  # ★★ z = 0 은 **도크 바닥 = 트럭 적재함 바닥**이다. 야드 지면이 아니다 (구 사양서 §5-1).
  #   "적재한 팔레트를 들지 않고 그대로 밀어 트럭에 넣는다" 는 요구는 이 규약으로 이미 만족된다 —
  #   팔레트 밑면이 z=0 이고 그게 곧 트럭 바닥이라 높이차가 0 이다.
  #   반출 롤러 상면도 z=0 이다(바닥에 얹는 구조물이 아니라 바닥과 같은 면).
  #
  #   ⚠ 2026-08-22 한때 팔레트를 z=1000 으로 올리고 페데스탈을 1700 으로 키운 판이 있었다.
  #     같은 요구를 "지면 기준"으로 푼 것인데, 구 사양서 §5-1 이 **그 계산을 이미 하고 기각**했다:
  #       "로봇을 지면에 두면 파렛트 상면이 1,000, 적재 상단이 2,300 이 되어 받침대 약 1,580 이
  #        필요하다. 79 kg 로봇을 1.6 m 구조물에 올리는 것은 비현실적이다.
  #        -> 상차 도크 바닥을 트럭 적재함 높이에 맞춘다."
  #     도크로 풀면 같은 기하를 페데스탈 700 급으로 얻는다. 700 복원 뒤 다층 실측으로 900 확정 (robot 주석).
  pallet_origin_world_mm:
    A: [10300,  1800, 150]
    B: [10300,   300, 150]
    C: [10300, -1200, 150]
  robot_base_world_mm:
    # z = 페데스탈 높이 (robot.pedestal_height_mm 와 같아야 한다). 도크 바닥 위 900.
    # ★ 2026-08-24 이격 300 -> 400 (y 를 팔레트 반대쪽으로 100 뺐다). 팀 합의.
    #   이유: joint_1 이 픽(-X)에서 배치(+Y)로 90도 넘게 도는 동안 팔뚝이 수평 원호를
    #   그리며 근거리 기둥을 쓸어 밀었다 (error1.mp4). 궤적 전체 검사로만 잡힌다 —
    #   웨이포인트 정지 자세 검사는 같은 계획을 통과로 본다 (280 mm 차이).
    #   실측 (scripts/verify_transit_sweep_isaac.py, 구간 4 최악 여유):
    #     이격 450 -203.5 · **400 통과** · 350 -203.6 · 300 -100.5 · 250 -103.6 · 200 -49.5
    #   ⚠ **뒤로 더 빼면 나빠진다.** 팔이 뻗어 누우며 팔꿈치가 처진다 (최악이 link_3 이 된다).
    #     400 이 측정된 최선이고, 400 에서 5호 3단·혼합 20박스 모두 전 구간 통과한다.
    #   G1 재검증: 이격 400 에서 11점 통과 (아래 verify_reach.py 로 확인).
    A: [10900,  1400, 900]
    B: [10900,  -100, 900]
    C: [10900, -1600, 900]

conveyor:
  belt_velocity_mps: 0.5
  belt_top_z_mm: 800
  spawn_point_mm: [500, 0, 810]         # 박스 밑면 중심
  stopper_x_mm: 10000
  pickup_range_mm: [7500, 10000]
  stage1:
    main_range_mm:     [0,    7500]
  stage2:
    main_range_mm:     [0,    3000]
    sorter_range_mm:   [3000, 4000]
    diverter_range_mm: [4000, 5000]
    spur_range_mm:     [5000, 7500]

pallet:
  width_mm: 1200              # Px — 월드 +X. 로봇이 이 긴 변 바깥에 선다
  depth_mm: 800               # Py — 월드 +Y. 존이 늘어선 방향, 3개 붙여 2400
  thickness_mm: 150
  max_stack_mm: 1300          # 1t 트럭 내高 1600 − 팔레트 150 − 천장여유 150 (구 사양서 §5-1·§3-1)
                              # 팔레트 **상면 기준** 높이다. 월드 z = pallet_origin.z + 1300.

truck:
  # ★ bed_height_mm 은 **야드 지면 대비 도크(=트럭 적재함) 바닥 높이**다. 월드 z 가 아니다.
  #   월드에서 트럭 바닥은 z = 0 이고, 야드 지면이 z = -850 이다 (구 사양서 §5-1).
  #   즉 이 값은 씬에 야드 지면을 그릴 때만 쓰이고, 도달범위 계산에는 들어가지 않는다.
  #   ⚠ 이 값을 팔레트 z 로 쓰면 안 된다 — 그러면 페데스탈이 1700 까지 커진다.
  bed_height_mm: 850
  interior_height_mm: 1600    # 바닥 2800 x 내高 1600 (구 사양서 §5-1)

heightmap:
  cell_mm: 10
  w_height: 0.6
  w_support: 0.4
  w_far: 0.1                  # 로봇에서 먼 쪽(Py 큰 쪽)부터 채운다. 가까운 변을 마지막에
                              # 남겨야 팔뚝이 이미 놓인 박스 위를 안 넘는다 (트랙 B 피드백).
                              # 시드 30개(투입70): 팔 넘김 5.3회 → 3.1회 · 적재율 65.6% → 66.9%
                              # (적재율 손해 없음 — 0 이면 기존 동작)
  w_level: 0.05               # ★ 2026-08-25 신규. 새 박스 윗면이 이웃 최고높이와 맞으면 가점.
                              #   이 팔레트의 표면은 "조금 울퉁불퉁"해지지 않는다 — 박스 높이가
                              #   210/280/340 뿐이라 단차가 늘 60mm 이상이라 **평평 아니면 절벽**이다.
                              #   절벽이 생기면 지지율(0.7)에 걸려 자리가 있어도 못 놓는다:
                              #   실측 계획실패 26.6회 중 19.6회가 지지율 미달, 그때도 높이·통로로는
                              #   셀 27%가 남아 있었다. 이 항이 절벽 생성을 미리 억제한다.
                              #   시드 3집합 교차검증 (튜닝1-30 / 검증31-70 / 2차검증71-170):
                              #     58.5 -> 60.8  ·  59.5 -> 61.3  ·  58.5 -> 59.8  (%)
                              #   ⚠ 0.1 이상은 튜닝 시드에서만 오르고 검증에서 사라진다 (과적합).
  level_ring_cells: 4         # 이웃으로 볼 바깥 셀 수 (40mm). 2/4/8 어디든 결과가 같이 오른다.
                              #   ⚠ gripper_body_diameter 기반 통로 반경(12셀)과 **다른 값**이다.
  w_wall: 0.2                 # 벽 밀착도 가중치. 박스를 팔레트 가장자리로 밀어붙여
                              # 가운데에 큰 박스가 들어갈 덩어리 공간을 남긴다.
                              # 0 이면 기존 동작. 시드 20개 평균 적재율 48.1% → 54.9%
  plan_clearance_mm: 10       # ★ 2026-08-25 신규 (김병직 실측 → 정정인 승인).
                              #   발자국을 이만큼 부풀려 **박스 사이에 실제 틈**을 남긴다.
                              #   0 은 슬롯이 박스와 정확히 같은 크기라 물리적으로 성립하지 않는다:
                              #   콜라이더 contact offset 이 면마다 2mm, 배치 XY 오차 실측 최대
                              #   7.6mm, yaw 오차 4.0도(410 박스 모서리 14mm).
                              #   Isaac 20박스: 0 이면 9kg 5호가 338mm 위에서 막히고 이웃을
                              #   1046mm 밀어 팔레트 밖으로 떨어뜨렸다 (RESULT 실패).
                              #   10 에서 20/20 · 10단 1300mm · knock 11.5mm · 통과.
                              #   ⚠ plan 과 update 에 똑같이 걸린다 (heightmap_core 안에서).
  gripper_clearance_mm: 30
  allowed_yaw_deg: [0, 90]
  min_support_ratio: 0.7
  support_tol_mm: 10          # = cell_mm. 양자화 1칸 허용
  yaw_tol_deg: 5.0
  topk_support_check: 50
  # ★ 2026-08-25 신규. 후보 k개를 각각 놓아 보고, 그 뒤 박스를 rollouts 번 굴려
  #   depth 개까지 채워 본 뒤 **미래 부피가 큰 자리**를 고른다.
  #   왜 이제 하나: plan() 이 2.7ms 인데 로봇 모션이 5~10초다. 계산 예산이 1000배
  #   남는데 한 수만 보고 확정하고 있었다.
  #   그리디는 "지금 이 박스에 제일 좋은 자리" 를 고르는데, 그 자리가 다음 박스들이
  #   들어올 표면을 망칠 수 있다 — 기둥이 생기던 이유다 (트러블슈팅 TS-031).
  #   시드 교차검증 (튜닝1-30 / 검증31-70):  59.9 -> 61.6%  ·  59.0 -> 61.1%
  #   비용: plan() 1회 2.7ms -> 약 150ms. 모션 5~10초 안에서 충분하다.
  #   k: 1 로 두면 앞보기가 꺼지고 예전 그리디와 **완전히 같다**.
  lookahead: {k: 1}           # ★ 지금은 **꺼짐**. k:1 이면 예전 그리디와 완전히 같다.
  #   ── 왜 만들어 놓고 끄나 (2026-08-25) ──
  #   효과는 있다. k4/rollouts3/depth8 로 검증 시드 59.0% -> 60.2% (+1.2%p).
  #   그런데 **명세서 §7.9 의 `plan() < 200ms` 를 깬다**:
  #     꺼짐   평균  2ms · 95%   7ms · 최악  22ms   OK
  #     4/3/4  평균 57ms · 95% 206ms · 최악 407ms   초과
  #     4/3/8  평균131ms · 95% 436ms · 최악 719ms   초과
  #   중앙값은 9ms 다 (후보가 1개뿐이면 앞보기가 안 돈다). 꼬리가 길 뿐이다.
  #   ⚠ 시간 예산으로 잘라 내는 방법은 쓰면 안 된다 — 결과가 기계 속도에 따라 달라져
  #     평가 항목 "재현성(Play/Stop)" 이 그 자리에서 깨진다.
  #   그래서 **수용기준을 낮춰 통과시키는 대신 끄고 팀 판단으로 넘긴다.**
  #   켜려면: k: 4, rollouts: 3, depth: 8  (그리고 §7.9 기준을 함께 고쳐야 한다)
  #   ⚠ 진짜 다음 박스를 알려 줘도 이득이 거의 없다 (추측 59.0% vs 진짜 2개 59.4%).
  #     `PlanPlacement` 에 upcoming 목록을 추가할 값어치는 없다 — 혼입비만으로 충분하다.

robot:
  # 도크 바닥(z=0) 위 900. 구 사양서 §3 계산값은 700 — 아래 ★ 다층 실측으로 +200.
  #   ⚠ 한때 1700 으로 키운 판이 있었다 — 팔레트를 야드 지면 기준 z=1000 으로 올렸기 때문이다.
  #     그 전제를 도크 규약(z=0 = 트럭 바닥)으로 되돌리면 700 으로 충분하다.
  #     구 사양서 §5-1 이 "받침대 약 1,580 이 필요하다. 79 kg 로봇을 1.6 m 구조물에 올리는 것은
  #     비현실적이다 -> 도크로 해결한다" 로 이미 기각한 방향이다. zones 주석 참조.
  # ★ 2026-08-22 700 -> 900 (results/issues/18, 15박스 다층 실측).
  #   700 의 두 가지 문제가 900 에서 같이 풀린다:
  #   1) 다층 적재 시 팔이 기둥을 친다 — 근거리 기둥 상단이 베이스보다 ~100 이상
  #      높아지면 link_2/팔꿈치가 닿는다. 700 은 팔꿈치가 560 기둥에도 -65 mm.
  #   2) 도달 여유가 위로 치우쳐 있었다 — 먼 코너 상단 1572 / 바닥 1368 (실효 1550,
  #      상단 여유 -22). 900 이면 상·하단이 1460/1460 으로 고르게 펴져 +90.
  #   G1 11점 재검증 통과 (verify_reach --pedestal 900). Isaac 15박스 7단 완주,
  #   knock 0.1 mm. 구 사양서 §5-1 이 기각한 것은 1,580 이라 이 논거에 안 걸린다.
  pedestal_height_mm: 900
  # ★ B0 확정 (2026-08-21, 김병직). 구 저장소 h2017_cell.usd 그리퍼 메시 실측값.
  gripper_length_mm: 150            # 플랜지(tool0) ~ 흡착 접촉면
  gripper_body_diameter_mm: 245     # 몸통 원기둥. 밑면이 흡착면과 같은 평면이다
  gripper_pad_span_mm: [210, 160]   # Ø50 패드 4개의 바깥 치수
  # 흡착 (B3). 힘 상한은 물리로 못 건다 — 컨트롤러에서 규제한다 (흡착_그리퍼_트러블슈팅 문제②)
  suction:
    pad_diameter_mm: 50
    pad_xy_mm: [[80, 55], [80, -55], [-80, 55], [-80, -55]]   # tool0 로컬, z = 그리퍼 길이
    body_mass_kg: 2.0               # 유효 가반 20 − 2 ≈ 18 kg (구 사양서 §2)
    max_grip_distance_mm: 20        # 패드가 상판을 무는 거리. 작을수록 "닿아야만" 잡힌다
    retry_interval_s: 10.0          # ★ "재시도 간격"이 아니라 닫기를 시도하는 **총 시간**
                                    #   0 이면 즉시 포기해 영영 Open 에 머문다
    # ★ 씬에서는 사실상 무제한이다. 39 / 15 (= 16 kgf ÷ 4패드) 는 작업순서.md 의 **계획값**이고,
    #   실제로 작동한 h2017_cell.usd 는 둘 다 1e6 이다. 트러블슈팅 문제② 결론 —
    #   하드 리미트가 하중을 대신 받아버려 이 값들이 힘을 아예 못 보므로 재현성이 없다.
    #   16 kgf 규제는 아래 controller_limits 로 컨트롤러가 한다.
    coaxial_force_limit_n: 1000000.0   # YAML 1.1 은 1.0e6 을 문자열로 읽는다. 지수표기 쓰지 말 것
    shear_force_limit_n: 1000000.0
    controller_limits:
      suction_limit_kgf: 16.0       # Ø50 x 4패드 실용 흡착력 (진공 −60 kPa · 안전계수 3 포함)
      box_mass_limit_kg: 10.0       # 골판지 상판 강성. 10 < 16 이라 이쪽이 먼저 걸린다
      assumed_box_mass_kg: 9.0      # 지시에 mass_kg 이 없을 때. 사양서 최대 박스(5호)
    # 패드 D6 조인트. **전부 h2017_cell.usd 실측값이다** — 임의로 고치지 말 것.
    #   6축을 다 잠그면 구속이 생긴 자세 그대로 굳어 박스가 40 mm 떠서 붙는다.
    #   Z 로 슬롯을 열어 두고 drive 스프링이 끌어당기는 구조여야 밀착한다.
    pad_joint:
      trans_z_limit_mm: [0.0, 5.0]  # Z 만 5 mm 슬롯. X/Y 는 잠금(high < low)
      rot_limit_deg: 3.0            # rotX/rotY/rotZ ±3° — 패드가 상판에 순응할 여유
      drive_trans_z: {stiffness: 20000.0, damping: 400.0}
      drive_rot_xy: {stiffness: 100.0, damping: 0.0}
      drive_rot_z: {stiffness: 10000.0, damping: 0.0}
  approach_offset_mm: 200
  # 관절 속도한계(URDF) 대비 배율. 웨이포인트 보간의 스텝 수를 정한다.
  #   계단 입력은 금지다 — 팔이 최대 토크로 잡아채며 오버슈트해 박스를 친다
  #   (흡착_그리퍼_트러블슈팅 문제①). verify_cycle.py --vel 과 같은 값이다.
  joint_speed_scale: 0.5
  release_speed_threshold_mm_s: 5.0
  release_wait_timeout_s: 3.0
  release_damping: 5.0
  release_damping_duration_s: 0.5
  settle_wait_s: 0.5
  cycle_time_target_s: 10.0

physics:
  scene:
    enable_stabilization: true
    enable_ccd: false
    time_steps_per_second: 60
  material:
    static_friction: 0.6
    dynamic_friction: 0.5
  rigid_body:
    solver_position_iterations: 24
    solver_velocity_iterations: 4
  collider:
    rest_offset_mm: 0
    contact_offset_mm: 2
  articulation:
    solver_position_iterations: 32
    solver_velocity_iterations: 4

recognition:
  enabled: false
  # ── 픽업 하향 카메라 (2026-08-23 추가, 김학민/A) ──────────────────
  # ★ 위 cam1_x_mm(600)·cam2_x_mm(1400)은 **투입부** 검사용이고, 이건 다른 것이다.
  #   집는 자리 바로 위에서 아래를 보며 박스 좌표를 뽑는다.
  #   z 는 팔이 지나가는 높이를 피해야 한다 — 이송 최대 TCP 1.75 m + 그리퍼
  #   0.15 m = 플랜지 1.90 m 라 2.30 m 로 둔다 (여유 400 mm).
  #   x 는 스토퍼에서 박스 폭 절반만큼 뒤다. 박스 앞면이 스토퍼에 닿아 서므로
  #   중심은 종류마다 9760(5호)~9830(3호) 사이인데, 그 가운데를 본다.
  #   기종은 Intel RealSense D455 를 상정한다. 에셋 라이브러리가 원격이라
  #   이 PC 에서는 못 받아온다 — 같은 외형 치수(124x26x29 mm)의 하우징을 그리고
  #   그 안에 Camera 프림을 넣는다. 광학 성능은 아래 값이 정본이다.
  pick_cam:
    enabled: true
    y_mm: 0
    z_mm: 2300
    model: "rsd455"
    housing_mm: [124, 26, 29]     # D455 외형 (가로 x 두께 x 높이)
  # ── 손목 카메라 (2026-08-23 추가, 김학민/A) ────────────────────────
  # 로봇 손목(tool0)에 같이 달려 다니며 **집는 순간**을 본다. 위 pick_cam 이
  # 고정 하향이라면 이쪽은 이동식이다 — 실물 팔레타이징의 hand-eye 배치다.
  #   offset_mm : tool0 로컬. +Z 가 흡착 방향이라 z 는 그리퍼 쪽(아래)이 양수다.
  #               그리퍼 몸통(x 0 부근)을 피해 옆으로 비켜 단다.
  #   카메라는 USD 규약상 -Z 를 보므로 부모 +Z 를 보게 X 축으로 180도 돌려 얹는다.
  wrist_cam:
    enabled: true
    # 그리퍼 몸통에 단다. `/World/robot/gripper` 는 link_6 에 고정조인트로 붙은
    # 강체라 tool0 와 같은 자리에서 같이 움직인다 (mount = PhysicsFixedJoint).
    parent: "/World/robot/gripper"
    # ★ 2026-08-24 (100, 0, 30) -> (170, 0, 30). **카메라가 그리퍼 몸통 안에 있었다.**
    #   그리퍼 하위 형상 실측(로컬 bbox): body x,y = ±122.8 mm, z = -0.2 ~ 150.2 mm.
    #   x=100 은 그 원통 **안**이다. 카메라가 107 mm 짜리 그리퍼 속살을 들여다보고
    #   있었고, 이미지가 화소 전부 0 으로 나왔다 — 돔 조명을 100000 까지 올려도
    #   그대로 0 이었다(진단 실측). 조명 문제가 아니라 파묻힌 것이었다. 같은 진단에서
    #   픽업 카메라는 평균 196/255 로 멀쩡했으니 렌더 경로 문제도 아니었다.
    #   170 으로 빼면 몸통 표면에서 47 mm 떨어지고, 평균이 0 -> 233 으로 돌아온다.
    offset_mm: [170, 0, 30]
    # ★ 시선을 툴 축 쪽으로 기울인다. 0 이면 축과 나란해 흡착면이 화면 밖이다.
    #   (170, 0, 30) 에서 몸통 밑모서리(122.8, 150.2)를 스치는 각이 21.4 deg 라
    #   그보다 작아야 그리퍼에 안 가린다. 18 deg 면 흡착면에서 250 mm 아래 지점
    #   (박스 윗면쯤)에서 시선 중심이 툴축에서 50 mm 다 — 집는 자리가 화면 가운데다.
    tilt_deg: 18
    model: "rsd455"
    housing_mm: [124, 26, 29]
    # ★ 하우징 긴 변(124)을 **접선 방향**(툴 Y)으로 눕힌다. 반경 방향으로 눕히면
    #   ±62 mm 라 몸통(122.8)을 파고든다. 눕히면 반경 방향 폭이 ±14.5 로 준다.
    housing_tangential: true
  cam1_box_miss_rate: 0.10    # 박스당 1회 판정
  max_retry: 3
  cam1_x_mm: 600
  cam2_x_mm: 1400
  resolution: [1280, 720]
  hfov_deg: 60
  publish_rate_hz: 30

# ── 조명 ─────────────────────────────────────────────────────
# ★ 왜 조명이 "사양" 에 들어오나. GUI 뷰포트는 씬 조명이 약해도 **자체 조명 리그**로
#   밝게 보여 준다. 그런데 오프스크린 렌더(ROS 로 내보내는 카메라, 인식용 render
#   product)에는 그 리그가 없어서 **씬 조명만** 받는다. 그래서 눈으로 보기엔 멀쩡한
#   씬이 카메라로는 캄캄하게 찍힌다.
#   실측 2026-08-24 (같은 실행에서 돔만 켜고 껐다, 화소 평균 / 순수 검정 비율):
#                     돔 없음(DistantLight 3000 뿐)   돔 1000
#       픽업 카메라          180 / 0.00                 196 / 0.00
#       손목 카메라           94 / 0.60                 233 / 0.00
#       perspective          220 / 0.00                 235 / 0.00
#   손목처럼 하늘·배경이 많이 잡히는 시야는 돔이 없으면 화면의 60 %가 순수 검정이다.
#   물리에는 영향이 없다 (콜라이더도 질량도 없다).
#   ⚠ 앞으로 픽업 좌표 인식(camera_pick.py)도 같은 오프스크린 경로를 쓴다.
lighting:
  dome:
    enabled: true
    intensity: 1000            # Isaac 기본 환경 돔과 같은 값
    color: [1.0, 1.0, 1.0]

arbiter:
  enabled: true
  trigger_x_mm: 2000
  decision_timeout_s: 0.6
  default_on_timeout: "NORMAL"

service:
  timeout_s: 2.0
  retry: 1
