# =============================================================================
#  모든 숫자의 단일 출처. 코드에 상수를 박지 않는다. (작업명세서 §4, 철칙 3)
#  값을 바꾸면 PR 설명에 "바꾼 키와 이유" 를 반드시 적는다.
# =============================================================================
stage: 1                       # 1 = B구역 단독(Day1~3) / 2 = 3구역(Day4~)

boxes:
  types:
    # 치수·질량·혼입비율 = 구 사양서 §4-1 · §4-3 (2026-08-22 기준 통일)
    #   질량은 화물 밀도 150 kg/m³ 가정에서 유도. 흡착 상한 10 kg (§4-4) 안.
    #   ※ 5호 깊이는 380 이 맞다 — 실제 우체국 규격. 구 사양서 §4-1 의 360 은 오타다
    #      (같은 표의 부피 58.8 L 가 360 으로 계산된 값. 380 이면 62.0 L).
    - {name: "3호", w_mm: 340, d_mm: 250, h_mm: 210, mass_g: 3000}
    - {name: "4호", w_mm: 410, d_mm: 310, h_mm: 280, mass_g: 5000}
    - {name: "5호", w_mm: 480, d_mm: 380, h_mm: 340, mass_g: 9000}
  size_distribution: [0.5, 0.3, 0.2]         # 소형이 많은 실제 택배 분포 (§4-3)
  random_seed: 42                            # 고정 — 베이스라인 비교 필수
  spawn_yaw_deg: 0
  stage1: {spawn_interval_s: 12.0, total_count: 15, zone: "B",
           zone_bias: {A: 0.0, B: 1.0, C: 0.0}}
  stage2: {spawn_interval_s: 4.0, total_count: 45}

run_profile: "packing"         # "packing" | "coordination"
profiles:
  packing:      {zone_bias: {A: 0.334, B: 0.333, C: 0.333}, arbiter_enabled: false}
  coordination: {zone_bias: {A: 0.6,   B: 0.2,   C: 0.2},   arbiter_enabled: true}

zones:
  list: ["A", "B", "C"]
  buffer_capacity: 4
  # ★ 2026-08-22 셀 90도 회전 확정. 팔레트가 로봇 **정면(+Y)** 쪽으로 왔다.
  #   이유: 존이 늘어선 방향(Y)으로 팔레트가 800 이어야 3개 붙여 2400 mm 가 되고
  #   그래야 트럭 바닥 2800 에 들어간다 (구 사양서 5-2). 이전 배치는 1200 x 3 = 3600 으로 초과였다.
  #   ⚠ 팔레트만 돌리면 최원점이 1902 mm 로 도달범위(1700)를 넘는다. 로봇이 팔레트의
  #     **긴 변(1200) 바깥에 300 이격**해 서야 1667 mm 가 된다 (구 사양서 3-1 "장변 중앙 이격 300").
  # ★ 2026-08-22 팔레트를 트럭 적재함 바닥 높이로 올렸다 (김학민).
  #   적재한 팔레트를 들지 않고 그대로 반출 컨베이어로 밀어 트럭에 넣는다.
  #   그래서 팔레트 **밑면** = truck.bed_height_mm. z 는 상면이므로 850+150=1000.
  pallet_origin_world_mm:
    A: [10300,  1800, 1000]
    B: [10300,   300, 1000]
    C: [10300, -1200, 1000]
  robot_base_world_mm:
    # z = 페데스탈 높이 (robot.pedestal_height_mm 와 같아야 한다).
    A: [10900,  1500,  700]
    B: [10900,     0,  700]
    C: [10900, -1500,  700]

conveyor:
  belt_velocity_mps: 0.5
  belt_top_z_mm: 800
  spawn_point_mm: [500, 0, 810]         # 박스 밑면 중심
  stopper_x_mm: 10000
  pickup_range_mm: [7500, 10000]
  stage1:
    main_range_mm:     [0,    7500]
  stage2:
    main_range_mm:     [0,    3000]
    sorter_range_mm:   [3000, 4000]
    diverter_range_mm: [4000, 5000]
    spur_range_mm:     [5000, 7500]

pallet:
  width_mm: 1200              # Px — 월드 +X. 로봇이 이 긴 변 바깥에 선다
  depth_mm: 800               # Py — 월드 +Y. 존이 늘어선 방향, 3개 붙여 2400
  thickness_mm: 150
  max_stack_mm: 1300          # 1t 트럭 내高 1600 − 팔레트 150 − 천장여유 150 (구 사양서 §5-1·§3-1)
                              # 팔레트 **상면 기준** 높이다. 월드 z = pallet_origin.z + 1300.

truck:
  # ★ bed_height_mm 은 아직 가정값이다 (1t 포터/봉고 적재함 지상고 실측 850).
  #   확정되면 여기만 고치면 씬(run_layout_to_spec.sh)과 도달검증이 따라온다.
  #   팔레트를 적재 후 그대로 밀어 넣으므로 팔레트 밑면이 이 높이에 있어야 한다.
  bed_height_mm: 850
  interior_height_mm: 1600    # 바닥 2800 x 내高 1600 (구 사양서 §5-1)

heightmap:
  cell_mm: 10
  w_height: 0.6
  w_support: 0.4
  gripper_clearance_mm: 30
  allowed_yaw_deg: [0, 90]
  min_support_ratio: 0.7
  support_tol_mm: 10          # = cell_mm. 양자화 1칸 허용
  yaw_tol_deg: 5.0
  topk_support_check: 50

robot:
  # 700 으로 간다 (김학민 지시 2026-08-22).
  # ⚠ 팔레트가 트럭 바닥 높이(850)에 있는 지금 배치에서는 적재 상단 4점이
  #   도달범위 밖이다 (필요 2193 > 실효 1550). scripts/verify_reach.py 참조.
  #   700 에서 실제로 쌓을 수 있는 높이는 팔레트 상면 기준 412 mm 뿐이다
  #   (= 700 + sqrt(1550^2 - 1253^2) - 1000 - approach 200).
  #   max_stack_mm 1300 을 유지하려면 페데스탈 1588 이상이거나
  #   팔레트를 바닥(z=150)으로 내려야 한다. 미결 항목이다.
  pedestal_height_mm: 700
  # ★ B0 확정 (2026-08-21, 김병직). 구 저장소 h2017_cell.usd 그리퍼 메시 실측값.
  gripper_length_mm: 150            # 플랜지(tool0) ~ 흡착 접촉면
  gripper_body_diameter_mm: 245     # 몸통 원기둥. 밑면이 흡착면과 같은 평면이다
  gripper_pad_span_mm: [210, 160]   # Ø50 패드 4개의 바깥 치수
  approach_offset_mm: 200
  release_speed_threshold_mm_s: 5.0
  release_wait_timeout_s: 3.0
  release_damping: 5.0
  release_damping_duration_s: 0.5
  settle_wait_s: 0.5
  cycle_time_target_s: 10.0

physics:
  scene:
    enable_stabilization: true
    enable_ccd: false
    time_steps_per_second: 60
  material:
    static_friction: 0.6
    dynamic_friction: 0.5
  rigid_body:
    solver_position_iterations: 24
    solver_velocity_iterations: 4
  collider:
    rest_offset_mm: 0
    contact_offset_mm: 2
  articulation:
    solver_position_iterations: 32
    solver_velocity_iterations: 4

recognition:
  enabled: false
  cam1_box_miss_rate: 0.10    # 박스당 1회 판정
  max_retry: 3
  cam1_x_mm: 600
  cam2_x_mm: 1400
  resolution: [1280, 720]
  hfov_deg: 60
  publish_rate_hz: 30

arbiter:
  enabled: true
  trigger_x_mm: 2000
  decision_timeout_s: 0.6
  default_on_timeout: "NORMAL"

service:
  timeout_s: 2.0
  retry: 1
