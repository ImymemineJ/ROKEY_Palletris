# =============================================================================
#  모든 숫자의 단일 출처. 코드에 상수를 박지 않는다. (작업명세서 §4, 철칙 3)
#  값을 바꾸면 PR 설명에 "바꾼 키와 이유" 를 반드시 적는다.
# =============================================================================
stage: 1                       # 1 = B구역 단독(Day1~3) / 2 = 3구역(Day4~)

boxes:
  types:
    - {name: "3호", w_mm: 340, d_mm: 250, h_mm: 210, mass_g: 2000}
    - {name: "4호", w_mm: 410, d_mm: 310, h_mm: 280, mass_g: 4000}
    - {name: "5호", w_mm: 480, d_mm: 380, h_mm: 340, mass_g: 6000}
  size_distribution: [0.334, 0.333, 0.333]
  random_seed: 42                            # 고정 — 베이스라인 비교 필수
  spawn_yaw_deg: 0
  stage1: {spawn_interval_s: 12.0, total_count: 15, zone: "B",
           zone_bias: {A: 0.0, B: 1.0, C: 0.0}}
  stage2: {spawn_interval_s: 4.0, total_count: 45}

run_profile: "packing"         # "packing" | "coordination"
profiles:
  packing:      {zone_bias: {A: 0.334, B: 0.333, C: 0.333}, arbiter_enabled: false}
  coordination: {zone_bias: {A: 0.6,   B: 0.2,   C: 0.2},   arbiter_enabled: true}

zones:
  list: ["A", "B", "C"]
  buffer_capacity: 4
  pallet_origin_world_mm:
    A: [11200,   900, 150]
    B: [11200,  -600, 150]
    C: [11200, -2100, 150]
  robot_base_world_mm:
    A: [10900,  1500, 500]
    B: [10900,     0, 500]
    C: [10900, -1500, 500]

conveyor:
  belt_velocity_mps: 0.5
  belt_top_z_mm: 800
  spawn_point_mm: [500, 0, 810]         # 박스 밑면 중심
  stopper_x_mm: 10000
  pickup_range_mm: [7500, 10000]
  stage1:
    main_range_mm:     [0,    7500]
  stage2:
    main_range_mm:     [0,    3000]
    sorter_range_mm:   [3000, 4000]
    diverter_range_mm: [4000, 5000]
    spur_range_mm:     [5000, 7500]

pallet:
  width_mm: 800               # Px
  depth_mm: 1200              # Py
  thickness_mm: 150
  max_stack_mm: 850           # 트럭 내치 1000 − 팔레트 150

heightmap:
  cell_mm: 10
  w_height: 0.6
  w_support: 0.4
  w_wall: 0.2                 # 벽 밀착도 가중치. 박스를 팔레트 가장자리로 밀어붙여
                              # 가운데에 큰 박스가 들어갈 덩어리 공간을 남긴다.
                              # 0 이면 기존 동작. 시드 20개 평균 적재율 48.1% → 54.9%
  gripper_clearance_mm: 30
  allowed_yaw_deg: [0, 90]
  min_support_ratio: 0.7
  support_tol_mm: 10          # = cell_mm. 양자화 1칸 허용
  yaw_tol_deg: 5.0
  topk_support_check: 50

robot:
  pedestal_height_mm: 500
  gripper_length_mm: 150            # 확정 시 §3.4 재계산
  approach_offset_mm: 200
  release_speed_threshold_mm_s: 5.0
  release_wait_timeout_s: 3.0
  release_damping: 5.0
  release_damping_duration_s: 0.5
  settle_wait_s: 0.5
  cycle_time_target_s: 10.0

physics:
  scene:
    enable_stabilization: true
    enable_ccd: false
    time_steps_per_second: 60
  material:
    static_friction: 0.6
    dynamic_friction: 0.5
  rigid_body:
    solver_position_iterations: 24
    solver_velocity_iterations: 4
  collider:
    rest_offset_mm: 0
    contact_offset_mm: 2
  articulation:
    solver_position_iterations: 32
    solver_velocity_iterations: 4

recognition:
  enabled: false
  cam1_box_miss_rate: 0.10    # 박스당 1회 판정
  max_retry: 3
  cam1_x_mm: 600
  cam2_x_mm: 1400
  resolution: [1280, 720]
  hfov_deg: 60
  publish_rate_hz: 30

arbiter:
  enabled: true
  trigger_x_mm: 2000
  decision_timeout_s: 0.6
  default_on_timeout: "NORMAL"

service:
  timeout_s: 2.0
  retry: 1
