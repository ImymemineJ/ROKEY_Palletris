# =============================================================================
#  모든 숫자의 단일 출처. 코드에 상수를 박지 않는다. (작업명세서 §4, 철칙 3)
#  값을 바꾸면 PR 설명에 "바꾼 키와 이유" 를 반드시 적는다.
# =============================================================================
stage: 1                       # 1 = B구역 단독(Day1~3) / 2 = 3구역(Day4~)

boxes:
  types:
    # 치수·질량·혼입비율 = 구 사양서 §4-1 · §4-3 (2026-08-22 기준 통일)
    #   질량은 화물 밀도 150 kg/m³ 가정에서 유도. 흡착 상한 10 kg (§4-4) 안.
    #   ※ 5호 깊이는 380 이 맞다 — 실제 우체국 규격. 구 사양서 §4-1 의 360 은 오타다
    #      (같은 표의 부피 58.8 L 가 360 으로 계산된 값. 380 이면 62.0 L).
    - {name: "3호", w_mm: 340, d_mm: 250, h_mm: 210, mass_g: 3000}
    - {name: "4호", w_mm: 410, d_mm: 310, h_mm: 280, mass_g: 5000}
    - {name: "5호", w_mm: 480, d_mm: 380, h_mm: 340, mass_g: 9000}
  size_distribution: [0.5, 0.3, 0.2]         # 소형이 많은 실제 택배 분포 (§4-3)
  random_seed: 42                            # 고정 — 베이스라인 비교 필수
  spawn_yaw_deg: 0
  stage1: {spawn_interval_s: 12.0, total_count: 15, zone: "B",
           zone_bias: {A: 0.0, B: 1.0, C: 0.0}}
  stage2: {spawn_interval_s: 4.0, total_count: 45}

run_profile: "packing"         # "packing" | "coordination"
profiles:
  packing:      {zone_bias: {A: 0.334, B: 0.333, C: 0.333}, arbiter_enabled: false}
  coordination: {zone_bias: {A: 0.6,   B: 0.2,   C: 0.2},   arbiter_enabled: true}

zones:
  list: ["A", "B", "C"]
  buffer_capacity: 4
  pallet_origin_world_mm:
    A: [11200,   900, 1000]
    B: [11200, -1400, 1000]
    C: [11200, -2100, 1000]
  robot_base_world_mm:
    # z = 페데스탈 높이. 구 사양서 §3-1 "로봇 베이스 (600, −300, 700)" 기준
    A: [10900,  1500, 1800]
    B: [10900,  -800, 1800]
    C: [10900, -1500, 1800]

conveyor:
  belt_velocity_mps: 0.5
  belt_top_z_mm: 800
  spawn_point_mm: [500, 0, 810]         # 박스 밑면 중심
  stopper_x_mm: 10000
  pickup_range_mm: [7500, 10000]
  stage1:
    main_range_mm:     [0,    7500]
  stage2:
    main_range_mm:     [0,    3000]
    sorter_range_mm:   [3000, 4000]
    diverter_range_mm: [4000, 5000]
    spur_range_mm:     [5000, 7500]

pallet:
  width_mm: 800               # Px
  depth_mm: 1200              # Py
  thickness_mm: 150
  max_stack_mm: 1300          # 1t 트럭 내高 1600 − 팔레트 150 − 천장여유 150 (구 사양서 §5-1·§3-1)
                              # 팔레트 상면 기준 높이다. 월드 z 는 pallet_origin.z + 1300.

truck:
  # ★ bed_height_mm 은 가정값이다 (1t 포터/봉고 적재함 지상고 실측 850).
  # 확정되면 여기만 고치면 씬·도달검증이 전부 따라온다.
  # 팔레트를 적재 후 그대로 반출 컨베이어로 트럭에 밀어 넣으므로,
  # 팔레트 **밑면**이 이 높이에 있어야 한다.
  bed_height_mm: 850
  interior_height_mm: 1600

heightmap:
  cell_mm: 10
  w_height: 0.6
  w_support: 0.4
  gripper_clearance_mm: 30
  allowed_yaw_deg: [0, 90]
  min_support_ratio: 0.7
  support_tol_mm: 10          # = cell_mm. 양자화 1칸 허용
  yaw_tol_deg: 5.0
  topk_support_check: 50

robot:
  # 팔레트가 트럭 바닥 높이(850)로 올라가면서 700 -> 1800. 700 이면 적재 상단
  # (월드 z 2500) 이 리치 밖이다. scripts/verify_reach.py 로 역산·검증했다:
  #   700/900/1100/1300 실패, 1588 이상 필요, 1600 통과(+7mm) · 1800 통과(+63mm)
  pedestal_height_mm: 1800
  gripper_length_mm: 150            # 확정 시 §3.4 재계산
  approach_offset_mm: 200
  release_speed_threshold_mm_s: 5.0
  release_wait_timeout_s: 3.0
  release_damping: 5.0
  release_damping_duration_s: 0.5
  settle_wait_s: 0.5
  cycle_time_target_s: 10.0

physics:
  scene:
    enable_stabilization: true
    enable_ccd: false
    time_steps_per_second: 60
  material:
    static_friction: 0.6
    dynamic_friction: 0.5
  rigid_body:
    solver_position_iterations: 24
    solver_velocity_iterations: 4
  collider:
    rest_offset_mm: 0
    contact_offset_mm: 2
  articulation:
    solver_position_iterations: 32
    solver_velocity_iterations: 4

recognition:
  enabled: false
  cam1_box_miss_rate: 0.10    # 박스당 1회 판정
  max_retry: 3
  cam1_x_mm: 600
  cam2_x_mm: 1400
  resolution: [1280, 720]
  hfov_deg: 60
  publish_rate_hz: 30

arbiter:
  enabled: true
  trigger_x_mm: 2000
  decision_timeout_s: 0.6
  default_on_timeout: "NORMAL"

service:
  timeout_s: 2.0
  retry: 1
