# test_3.usd 좌표 오버레이 — system.yaml 위에 **덮어쓸 값만** 담는다.
#
# ★ 왜 별도 파일인가. system.yaml 은 "모든 숫자의 단일 출처"(철칙 3)이고 팀 4명이
#   공유한다. test_3 은 라인 배치가 근본적으로 달라(지선이 +Y) 값을 바꾸면 test1-1
#   기준의 게이트·베이스라인이 전부 무효가 된다. 그래서 원본은 두고 이 파일을
#   실행 시에만 얹는다.  PL_CONFIG_OVERLAY 로 지정한다.
#
# ★ 실측 근거 (test_3.usd, Isaac BBoxCache):
#     지선(Rollers_01) 끝 Y = 4181, 롤러면 z = 800
#     지선 중심 X : A -7596 · B -13596 · C -19596
#     로봇 베이스 : (지선중심, 5076, z 1200)  = 지선끝 + 895 (test1-1 규칙)
#     팔레트      : 중심 X = 로봇 X · Y 5376~6176 · 상면 z 950 (셀 컨베이어 위)

conveyor:
  # ★ 핵심. test_3 의 지선은 +Y 로 흐른다. spawner/camera_pick 이 pos[1] 을 본다.
  pickup_axis: "y"
  # 아래 두 값은 **위 축을 따라** 잰 것이다 (키 이름은 옛 것을 유지).
  stopper_x_mm: 4181          # 지선 끝 = 스토퍼 앞면
  # 지선 구간 전체 (Rollers_01 이 Y 878~4181). 하한이 있어야 **메인 라인 위 박스**와
  # 상한이 있어야 **팔레트에 놓인 박스**가 픽업 후보에서 빠진다 — 상한이 없어서
  # 로봇이 방금 놓은 걸 다시 집은 사고가 있었다 (spawner.py _refresh 주석).
  # 팔레트는 Y 5376~6176 이라 4181 상한으로 확실히 제외된다.
  pickup_range_mm: [878, 4181]
  # ★ 스폰 지점 = 씬에 있던 Cube 자리 (bbox 중심 -409, -66). 그 XY 는 메인 라인
  #   ConveyorTrack(X -4678~0, Y -985~985) 위이고, 이 벨트는 **-X 로 흐르므로**
  #   여기서 출발한 박스가 셀 A(-7596) -> B(-13596) -> C(-19596) 순으로 지나간다.
  #   z 는 벨트 상면 800 + 10 (밑면 기준, system.yaml 규약과 동일).
  spawn_point_mm: [-409, -66, 810]
  belt_top_z_mm: 800          # test1-1 과 같다 (지선 롤러면도 800)

  # ★ 0.5 -> 0.35 m/s (2026-08-25).
  #   5호(480x380x340 · 9 kg)가 스토퍼에 부딪히며 **앞으로 기울어 벽에 기댔다.**
  #   그러면 pickup_check 가 present 를 못 주고, 흡착도 6.6 mm 떠서 실패한다.
  #   스토퍼를 100 -> 300 mm 로 높여 3.36 mm 까지 줄었지만 허용(3.0)을 아직 넘었다.
  #   0.35 로 낮추니 2.08~2.40 mm 로 들어온다 (실측, 5호 2 개 연속 성공).
  #   ⚠ test1-1 은 0.5 그대로다 — 거기선 안 나던 문제고 기준선을 흔들면 안 된다.
  # ★ 2026-08-25: 0.35 -> 0.7 (사용자 요청 "너무 느려").
  #   0.35 는 5호가 **100 mm 스토퍼**에 부딪혀 앞으로 기울던 시절의 값이다.
  #   그 뒤 스토퍼를 300 mm 로 올리고 셀 롤러를 1300 으로 넓혀 조건이 달라졌다.
  #   ⚠ 5호 흡착 간극(허용 3.0 mm)이 이 값에 가장 민감하다. 바꿨으면 반드시
  #     `[gripper] 흡착 성공 ... 간극` 을 확인해라.
  belt_velocity_mps: 0.7

  # ── 소터 (ConveyorBelt_A47) ────────────────────────────────────────────
  # ★ 2026-08-25: 분기점을 A23 -> A47 로 바꾸고 **분류를 소터가 한다.**
  #   A47 의 본선 롤러에는 로컬 X 1651~2555 (월드 1491.7 mm) 구멍이 있고 그 자리를
  #   소터가 받친다. 소터는 자기 `IsaacConveyor`(Sorter/ActionGraph/conveyor_belt)를
  #   가진 **독립 컨베이어**다 — 그래서 소터만 옆으로 돌리면 뒤차는 본선을 그대로
  #   흘러온다. 옛 `set_direction` 은 본선 조각 6925 mm 를 통째로 꺾어서 그 조각에
  #   박스가 둘이면 영영 못 꺾었다 (투입 간격을 20 s 로 벌려야 했던 이유).
  #   ⚠ 소터가 서 있으면 그 구멍 때문에 **라인이 막힌다.** conveyor_ctl 의
  #     run_all/stop_all 이 소터를 같이 켜고 끈다.
  sorters:
    A: /World/ConveyorTrack_09/Sorter
    B: /World/ConveyorTrack_08/Sorter
    C: /World/ConveyorTrack_03/Sorter

  # ── 배율을 안 먹이고 **원시값 그대로** 쓰는 벨트 ──────────────────────────
  # ★ 왜 따로 두나. `conveyor_ctl` 은 요청 m/s 를 조각의 진행방향 배율로 나눠
  #   `graph:variable:Velocity` 에 써넣는다. 그 환산이 **순환 루프 조각들에서는
  #   안 맞는다** — 실측 2026-08-25: 배율 8.9995 로 환산한 0.0778 을 넣었더니
  #   `_05` 위의 박스가 2 초에 4 mm 밖에 안 갔다(사실상 정지). 원래 씬에 들어
  #   있던 0.2 로 두면 약 1.4 m/s 로 잘 흐른다.
  #   루프는 "분기점을 지나친 박스를 되돌리는" 길이라 **정확한 속도가 필요 없다.**
  #   그래서 환산을 포기하고 도는 것이 확인된 값을 그대로 쓴다.
  #   ⚠ 이 값들은 m/s 가 아니다. 그래프 변수 원시값이다.
  belt_velocity_raw:
    /World/ConveyorTrack_04/ConveyorBeltGraph: 0.5    # A11 루프 코너
    /World/ConveyorTrack_05/ConveyorBeltGraph: 0.2    # X -21737~-3853 (+X) — 실측 1.4 m/s
    /World/ConveyorTrack_01/ConveyorBeltGraph: 0.5    # A02 커브
    /World/ConveyorTrack_02/ConveyorBeltGraph: 0.3    # X -2967~-2064 (+Y)

  # ── 순환 루프 고침 (2026-08-25 실측) ─────────────────────────────────────
  # 박스가 리턴 벨트에서 멈추던 것. 원인이 **6 개**였고 전부 실측으로 갈랐다.
  # 근거와 순서는 `setup_test3_scene.py` [9] 주석에 있다.
  loop:
    # 커브의 direction 은 진행 방향이 아니라 **회전축**이고, 부호가 반대면
    # 박스가 커브 입구에서 선다 (실측: -37 → X -3620 정지 / +37 → 커브 완주).
    curve_dir:
      /World/ConveyorTrack_01: [0, 0, 37]
    # ★ 직선 조각의 direction 은 `_local_axis` 환산을 **믿으면 안 된다.**
    #   `_02` 롤러는 로컬축 길이가 0.472 / 1.000 / 1.040 로 심하게 비균등해서
    #   환산이 (1,0,0) 을 주는데 그건 월드 +X 다 — 박스를 벨트 밖으로 민다.
    #   실측: (1,0,0) dx +698 dy -1 (낙하) / (0,1,0) dy +444 (정상).
    straight_dir:
      /World/ConveyorTrack_02: [0, 1, 0]
    # 프레임이 롤러면 위 366~413 mm 솟아 조각 이음매에서 **벽**이 된다.
    # 본선 스폰 조각도 포함한다 — 그 옆벽(Y +-575.5)이 루프의 합류를 막았다.
    frames_off:
      - /World/ConveyorTrack_01
      - /World/ConveyorTrack_02
      - /World/ConveyorTrack_04
      - /World/ConveyorTrack_05
      - /World/ConveyorTrack
    # `_01` 롤러면이 769.5 로 30.5 mm 낮았다. 들어갈 땐 떨어지고 나올 땐 못 올라온다.
    level_to_ref:
      - /World/ConveyorTrack_01
    # `Rail_C_far` 가 Y -790 에 서서 루프 입구를 막았다. 본선 끝까지만 남긴다.
    rail_c_far_end_x_mm: -21700
    # 프레임을 끄면 옆가드도 사라진다 — 커브 출구에서 박스가 +X 로 빠져 떨어졌다.
    guard_rail:
      name: /World/LoopRail_01out
      y_mm: [-2300, -400]
      thickness_mm: 20
      z_mm: [800, 950]
    # 본선 스폰 구간의 옆가드. 프레임을 끈 대신 세운다.
    # -Y 쪽은 루프가 합류하는 창(merge_gap)만 비운다.
    main_rail:
      x_mm: [-6101, -12]
      merge_gap_x_mm: [-2900, -2000]
      # ★ 790 은 씬의 기존 `Rail_A/B/C_*` 와 같은 값이다. 480(본선 롤러 폭)에 붙이면
      #   5호(480x380)가 yaw 15도로 틀어질 때 Y 폭이 562 가 되어 레일을 스친다.
      y_mm: 790
      thickness_mm: 20
      z_mm: [800, 950]

  # ★ 코너 커브 조각. 팔레트가 셀(+Y)에서 합류(+X)로 **이 조각을 따라 돈다**.
  #   반출이 회전 반지름을 여기서 재서 정한다 — 하드코딩하지 않는다.
  curve_prim:
    A: /World/ConveyorTrack_06
    B: /ConveyorTrack_06
    C: /ConveyorTrack_09

  # ★★ 커브의 **진짜 호** (실측 2026-08-25, 롤러 28 개에 최소자승 원).
  #   ⚠ 커브 조각의 bbox 로 반지름을 잡으면 안 된다. 벨트면은 사각형이 아니라
  #     **부채꼴**이라, bbox 안이어도 부채꼴 안쪽을 가로질러 벨트 밖으로 나간다
  #     (실측 2026-08-25: bbox 로 잡은 1029 는 안쪽 반지름 1404 보다 375 mm 안쪽이었다).
  #   벨트: 중심선 반지름 1914.8 · 폭 1021.4 -> 안쪽 1404.1 · 바깥 2425.4
  #   팔레트 1200x800 이 벨트 안에 있으려면 중심선 반지름이 **1804.1 ~ 1950.1**:
  #       안쪽  R - 400 >= 1404.1              -> R >= 1804.1
  #       바깥  sqrt((R+400)^2 + 600^2) <= 2425.4 -> R <= 1950.1
  #   벨트 중심선 1914.8 이 그 안에 든다 (안쪽 여유 110 · 바깥 여유 34 mm).
  #   진입 중심선 X = center_x - R · 탈출 중심선 Y = center_y + R 이다.
  curve_arc:
    A: {center_mm: [-6882.8, 6975.7], radius_mm: 1914.8}
    B: {center_mm: [-12849.0, 7971.1], radius_mm: 1914.8}
    C: {center_mm: [-18881.2, 8951.0], radius_mm: 1914.8}

  # 팔레트가 서는 셀 컨베이어 prim. 반출 리프트가 프레임 높이를 재는 데 쓴다.
  # ★ 이름이 제각각이다 — A 와 B 는 루트 아래, C 만 /World 아래다 (GUI 복제 흔적).
  cell_prim:
    A: /ConveyorTrack_08
    B: /ConveyorTrack_07
    C: /World/ConveyorTrack_07

  # ★ 픽업 카메라 ROI 를 스토퍼 **앞면 5 mm 앞**에서 자른다 (기본값은 +20).
  #   test_3 은 5호가 스토퍼를 타고 기울지 않도록 스토퍼를 300 mm 로 올렸는데,
  #   그 상면(1100)이 3호(1010)·4호(1080) 박스보다 높아 카메라가 스토퍼 윗면을
  #   박스 윗면으로 잡았다 (2026-08-25: 종류 맞춤 0/1 · 중심 오차 486 mm).
  #   박스는 스토퍼에서 2.1~2.4 mm 떨어져 서므로 5 mm 를 잘라도 윗면은 다 남는다.
  cam_roi_far_margin_mm: -5

  # ── 벨트 그래프 배치표 ────────────────────────────────────────────────
  # ★ 왜 필요한가. conveyor_ctl.BELT_GRAPH 는 test1-1 의 두 조각(main·b_pickup)만
  #   안다. test_3 은 본선이 4 조각이고 존마다 지선·셀·합류가 따로 있어 10 개다.
  #
  # ★ 2026-08-24 씬 수리 기록. 아래 경로를 잡으면서 test_3.usd 의 그래프가
  #   전부 끊겨 있던 것을 찾았다 (fixgraph 로 수정 완료).
  #     · 지선 3개  : conveyorPrim 이 없어진 /World/ConveyorTrack_02 를 가리킴
  #                   -> GUI 로 복제한 뒤 원본을 지워서 관계가 죽어 있었다.
  #                      6 개 벨트가 **에러 없이** 아무것도 안 밀고 있었다.
  #     · 합류 3개  : conveyorPrim 이 **본선 롤러**를 가리킴 (복제 원본 그대로)
  #                   -> 합류 라인은 안 돌고 본선만 3 배로 밀렸다.
  #     · 셀 3개    : Velocity 변수에 값이 없었다 (authored=False)
  #
  # 한 seg 에 여러 조각을 적으면 **동시에** 켜고 끈다. 본선 4 조각 중 하나만
  # 안 서면 박스가 조각 경계에서 계속 끌려간다.
  belt_graphs:
    # ★ 2026-08-25 재작성. 씬이 바뀌었다 — 분기 조각을 scale 1.0 으로 줄이면서
    #   본선에 틈이 생겨 직선 조각 2 개를 끼웠고, 지선이 3303 -> 1930 으로 짧아져
    #   연장 3 개를 붙였고, 코너에 **커브 3 개**가 들어왔다.
    #   ⚠ 여기 안 적힌 그래프는 **아무도 안 켠다.** 그 조각 위에서 박스가 선다.
    main:
      - /World/ConveyorTrack/ConveyorBeltGraph          # X  -6101 ~   -12  스폰
      - /World/ConveyorTrack_09/ConveyorBeltGraph       # X  -9727 ~ -5744  분기 A
      - /ConveyorTrack/ConveyorBeltGraph                # X -11959 ~ -9646  사이 메움
      - /World/ConveyorTrack_08/ConveyorBeltGraph       # X -15742 ~-11760  분기 B
      - /ConveyorTrack_01/ConveyorBeltGraph             # X -17896 ~-15695  사이 메움
      - /World/ConveyorTrack_03/ConveyorBeltGraph       # X -21703 ~-17720  분기 C
    # 지선 = 스토퍼가 있는 픽업 구간. cycle.py 가 "<zone>_pickup" 으로 찾는다.
    # ★ 2026-08-25: 지선을 **한 조각**으로 늘렸다 (Y 513~4181). 연장 조각 3 개는
    #   비활성화했다 — 그 조각들이 박스를 벨트 속도로 옆으로 밀었기 때문이다
    #   (실측: 이음매에서 0.5 초에 X +322 mm). 자세한 것은
    #   `scripts/fix_test3_spur_stretch.py` 의 docstring 에 있다.
    a_pickup: /World/ConveyorTrack_09/ConveyorBeltGraph_01
    b_pickup: /World/ConveyorTrack_08/ConveyorBeltGraph_01
    c_pickup: /World/ConveyorTrack_03/ConveyorBeltGraph_01
    # 셀 = 팔레트를 실어 커브까지 옮기는 벨트 (팔레트가 이 위에 놓여 있다)
    a_cell: /ConveyorTrack_08/ConveyorBeltGraph
    b_cell: /ConveyorTrack_07/ConveyorBeltGraph
    c_cell: /World/ConveyorTrack_07/ConveyorBeltGraph
    # ★ 커브 코너 (ConveyorBelt_A02 · `curved: True`). 셀(+Y) -> 합류(+X) 를 잇는다.
    #   ⚠ 커브의 velocity 는 직선과 **단위가 다르다** (direction 이 (0,0,-37) 인
    #     회전축이다). conveyor_ctl 이 curved 를 보고 배율을 안 먹인다.
    a_curve: /World/ConveyorTrack_06/ConveyorBeltGraph   # X -9321~-6455 · Y 7493~9323
    b_curve: /ConveyorTrack_06/ConveyorBeltGraph         # X -15287~-12421 · Y 8488~10318
    c_curve: /ConveyorTrack_09/ConveyorBeltGraph         # X -21319~-18453 · Y 9468~11298
    # ★ 위치변환 레일용 — 분기 조각을 따로 잡는다. `main` 과 **일부러 겹친다**.
    main_a: /World/ConveyorTrack_09/ConveyorBeltGraph
    main_b: /World/ConveyorTrack_08/ConveyorBeltGraph
    main_c: /World/ConveyorTrack_03/ConveyorBeltGraph
    # 합류 = 커브를 나와 트럭 옆면(X -2400)까지 가는 +X 라인
    a_merge: /World/MergeLine_A/ConveyorBeltGraph        # X -6649~-2409
    b_merge: /World/MergeLine_B/ConveyorBeltGraph        # X -12594~-2420
    c_merge: /World/MergeLine_C/ConveyorBeltGraph        # X -18731~-2433
    # ★ 순환 루프는 `belt_graphs` 가 아니라 아래 `belt_velocity_raw` 로 돌린다.
    #   이유는 그쪽 주석에 있다 (배율 환산이 이 조각들에서 안 맞는다).

zones:
  # 팔레트 원점 = 상면의 X최소·Y최소 모서리. 팔레트가 **셀 컨베이어 위**라 z=950 이다
  # (test1-1 은 바닥이라 150 이었다).
  # ★ 2026-08-24 A안: 팔레트를 90도 돌려 **로봇 옆(-X)** 으로 옮겼다. test1-1 은
  #   벨트 옆에 팔레트가 있어 로봇 스윙이 90도인데, 앞선 배치는 지선 뒤라 180도였다.
  #   흡착 패드에 매달린 박스가 진자처럼 흔들리고 감쇠가 0이라 스윙이 클수록
  #   착지가 흔들린다 (CLAUDE.md 실측 22~76mm / -99.8mm).
  #   따라서 팔레트는 이제 **800(X) x 1200(Y)** 다 (test1-1 은 1200 x 800).
  #   원점 = 상면의 X최소·Y최소 모서리.
  # ★ 2026-08-24 이격 300 -> 400 (팀 합의, system.yaml 병합). test1-1 은 Y 로 뺐지만
  #   test_3 은 팔레트가 로봇의 -X 쪽이라 X 로 100 더 뺀다.
  pallet_origin_world_mm:
    A: [-8796, 4476, 950]
    B: [-14796, 4476, 950]
    C: [-20796, 4476, 950]

  # ★ 픽업 판정의 **가로축(X) 창** = 그 존 지선 롤러의 X 구간 (실측 bbox).
  #   이게 없으면 존 A 의 로봇이 존 B(X -12.9)·C(X -18.9) 지선에 놓인 박스를
  #   집으려 들어 IK_FAIL 이 난다 (실측 2026-08-24, 3 연발).
  #   진행축(Y)만으로는 어느 지선인지 구분할 수 없기 때문이다.
  # ★ 2026-08-25 재실측. 분기 조각이 scale 1.0 이 되면서 지선이 좁아지고 옮겨졌다.
  #   값은 **지선(분기) + 연장 조각을 합친** X 범위다.
  # ★ 2026-08-25 재실측. 지선을 **한 조각으로** 스토퍼까지 늘리면서(연장 조각 제거)
  #   지선이 로봇 중심에 정확히 맞았다.
  # ★ 2026-08-26 재실측. 이격 400 -> 500 으로 로봇이 X +100 이동했고, 지선 중심은
  #   로봇 X 를 따라가므로 창도 100 밀렸다 (Isaac 실측 -7947.6~-7044.4).
  pickup_cross_mm:
    A: [-7948, -7044]
    B: [-13948, -13044]
    C: [-19948, -19044]

  # ★ 반드시 넣어야 한다. 이 키가 없으면 `demo_stack15_test1_1.py:318` 이
  #   system.yaml 의 **test1-1 좌표(10900, ...)** 를 읽어, 팔 스윕 제약이
  #   엉뚱한 방위각으로 계산된다 (`_bearing_deg`).
  #   z = 페데스탈 높이. 지선 끝(4181) + 895 = 5076 은 test1-1 규칙 그대로다.
  # ★ 2026-08-26 이격 400 -> **500** (X 로 100 더 뺐다). system.yaml ee25497 와 맞춘다.
  #   2026-08-25 채택 실행이 전부 --standoff 500 이고, 적재율 75.5% 가 그 값에서
  #   나왔다. 로봇 쪽 Isaac 검증 완료(김병직).
  #   ⚠ 지선 중심 = 로봇 X 다. 이 값을 바꾸면 `setup_test3_scene.py` [5]·[7] 이
  #     지선·레일·스토퍼를 따라 옮긴다 — 아래 pickup_cross_mm 도 같이 바뀐다.
  robot_base_world_mm:
    A: [-7496, 5076, 1950]
    B: [-13496, 5076, 1950]
    C: [-19496, 5076, 1950]

robot:
  # ★ 페데스탈 900 -> **1250**.
  #   (1) 팔레트가 셀 컨베이어 위(상면 950)라 로봇 베이스보다 높다. 900 이면
  #       1300 적재 시 최원점이 1919 로 도달 1700 을 넘는다.
  #   (2) 이격이 400 이 되면서 1200 으로도 **1703.7** 이 되어 3.7 mm 모자랐다.
  #       1250 이면 dz 가 1050 -> 1000 이 되어 **1673.3**, 여유 26.7 mm.
  #   픽업 쪽은 수평 895 · dz -240 = 901.7 이라 여유가 넉넉하다.
  #
  #   ★ 1250 -> 1950 (2026-08-25). 팔 스윕 규칙의 진짜 뜻은
  #     "기둥 윗면(월드) <= 페데스탈 상면" 이다. 팔레트가 컨베이어 위(950)라
  #     1250 이면 쌓을 수 있는 높이가 300 mm 뿐이었다 (실측: "간섭 없이 갈 수 있는
  #     자리가 없다 — 한계 300 mm"). 도달 1700 안에서 최대가 되는 값이 1950 이다:
  #       빈 팔레트 최원점 1673.3 (2000 이면 1703.7 로 초과) · 만재 1341.6
  #       픽업(5호) 1207.1 · 스윕 한계 1950-950 = 1000 mm
  pedestal_height_mm: 1950

pallet:
  # ★ 코너에서 팔레트를 90° 돌린다 (팀 결정 2026-08-25).
  #   1톤 트럭 적재함은 2800 인데 팔레트 Y 변이 1200 이라 3장(3600)이 안 들어간다.
  #   돌리면 적재함을 가로지르는 치수가 width(800)가 되어 3장 2400, 여유 400.
  turntable_before_truck: true
  # ★ 최대 적재 1300 -> 1000. 팔레트가 셀 컨베이어 위(950)라 팔이 넘어갈 수 있는
  #   기둥 높이가 1000 mm 로 묶인다 (페데스탈 1950 - 팔레트 950). 그 위로 쌓으면
  #   이송 중 팔뚝이 기둥을 쓸어 박스를 떨어뜨린다 (실측 knock 1452 mm).
  #   트럭에는 팔레트 150 + 1000 = 1150 이라 내高 1600 안에 들어간다.
  max_stack_mm: 1000

  # ── 적재 스테이션 가이드 벽 (2026-08-26) ──────────────────────────────────
  # 팔레트 옆에 세워 **적재 중 박스 낙하를 막는다.** 반출용 합류 라인 가이드
  # (`truck.pallet_guide`)와는 다른 물건이다 — 그건 팔레트를 트럭까지 곧게 보내는 것.
  #
  # ★ 좌표를 여기 박지 않는다. `zones.pallet_origin_world_mm` 과 `pallet.width/depth`
  #   에서 유도하므로 팔레트가 90도 돌아 있든(test_3) 아니든(system.yaml) 맞는다.
  #   ⚠ 지금 두 설정의 팔레트 방향이 **서로 다르다** — 정본은 1200(X)x800(Y),
  #     test_3 는 800(X)x1200(Y) 다. 숫자를 박으면 한쪽이 반드시 틀린다.
  #
  # ★ 유효 적재 면적은 **안 줄어든다.** 벽이 팔레트 바깥 5 mm 에 서므로 배치
  #   가능 면적은 팔레트 그대로다. 5 mm 는 면적이 아니라 **허용 오버행**이다.
  #
  # ★ 로봇 쪽 벽은 **세우지 않는다** (팀 결정 2026-08-26). 흡착 툴 반경이 122.5 라
  #   가장 좁은 변(250) 박스를 가장자리에 놓을 때 여유가 7.5 mm 밖에 안 남는다.
  #   어느 쪽이 로봇 쪽인지는 `robot_base_world_mm` 과 팔레트 중심을 비교해 정한다.
  guide_wall:
    # ★ 2026-08-26 **끔.** 세울 수 있는 최대가 2 면(xlo·yhi)인데, 그 2 면조차
    #   막는 두 방향이 로봇이 안 드나드는 쪽이라 낙하 방지 효과가 거의 없다.
    #   대신 사이클이 벽 없음 22.9 -> 1 면 27.0 -> 2 면 28.6 s 로 늘었다.
    #   값은 그대로 둔다 — 개폐식 게이트로 다시 갈 때 이 수치가 필요하다.
    #   ⚠ 끄면 `setup_test3_scene.py` [12] 가 이미 선 벽을 **치운다.**
    enabled: false
    clearance_mm: 5          # 팔레트 가장자리 바깥 여유 (편도)
    thickness_mm: 20
    skip_robot_side: true
    # ★ 픽업 쪽 면도 비운다. 로봇이 박스를 **지선에서 집어 와** 팔레트로 넘기므로
    #   그 사이를 막으면 팔이 못 넘어간다 — 실측 2026-08-26 **12/12 IK_FAIL**.
    #   (픽업 Y 4181 · 팔레트 Y 4476~ · 벽이 Y 4451~4471 에 1150 mm 로 섰다)
    skip_pick_side: true
    # 높이: 벨트면부터 **적재 상한 위**까지 — 낙하를 막으려면 스택보다 높아야 한다
    z_from_mm: 800           # conveyor.belt_top_z_mm 와 같다
    z_to: stack              # 팔레트 상면 + max_stack_mm
    name_fmt: /World/PalletWall_%s_%s   # % (존, lo|hi)

  # ★ test_3 는 지선이 +Y 라 팔레트가 90도 돌아 있다. 긴 변(1200)이 지선과 나란해야
  #   로봇이 "긴 변 바깥 300" 에 설 수 있다 (사양 §3-1). 그래서 width/depth 가 뒤바뀐다.
  #   width_mm  = 월드 +X 방향 치수
  #   depth_mm  = 월드 +Y 방향 치수
  width_mm: 800
  depth_mm: 1200

# ── 색상(크기) 라우팅 ───────────────────────────────────────────────────────
# ★ 1차는 색상 판정(HTML §6)이고, 씬의 박스 색은 크기별 머티리얼 BoxNo3/4/5 다.
#   따라서 "색 -> 존" 은 "크기 -> 존" 과 같다. 2차에서 QR 로 바뀌면 by_type 만 뺀다.
routing:
  # ★ 2026-08-25: 분류 기준이 **QR 의 배송지** 다 (2 차 사양, CLAUDE.md §6).
  #   한 존에는 **그 배송지의 3·4·5 호가 섞여** 들어온다 — 그래야 패커가 실제로
  #   일한다 (한 가지 크기만 오면 최적화라고 할 게 없다).
  #   우선순위는 by_dest > by_color > by_type 다.
  by_dest:
    SEOUL: A
    BUSAN: B
    DAEJEON: C

  # (구) 1 차 색상 판정. by_dest 가 있으면 안 쓴다. 되돌릴 수 있게 남겨 둔다.
  by_color:
    red: A
    green: B
    blue: C

  # (구) 크기 기준. 색도 QR 도 없는 씬을 위한 하위호환.
  by_type:
    "3호": A
    "4호": B
    "5호": C

  # 분기점 = 그 존 지선 롤러의 X 구간 (실측 bbox). 박스 **중심**이 이 안에 들어오면 꺾는다.
  junction_x_mm:
    A: [-8048, -7144]
    B: [-14048, -13144]
    C: [-20048, -19144]

  # 꺾을 본선 조각. 조각 하나에 분기점 하나씩이라 존과 1:1 이다.
  main_seg:
    A: main_a
    B: main_b
    C: main_c

  # 꺾을 조각의 X 범위. 이 안에 다른 박스가 있으면 꺾지 않고 기다린다.
  # ★ 예전엔 분기점 +-3.5 m 로 봤는데, 조각은 7 m 라 바깥에 있던 박스가 뒤늦게
  #   조각 위로 올라와 같이 옆으로 밀렸다 (실측: BOX00001 이 X -9.36 에서 통과,
  #   창은 -9.310 까지였다). 조각 전체를 봐야 한다.
  # ★ 2026-08-25 재실측 (분기 조각 전체 bbox).
  main_seg_x_mm:
    A: [-9736, -5735]
    B: [-15751, -11751]
    C: [-21712, -17711]

  # ★ 본선 띠. 박스가 **이 Y 안에 있을 때만** 꺾는다.
  #   씬에는 순환 루프(ConveyorTrack_04/05/06, Y -6109~-4139)가 있어서 분기점을
  #   지나친 박스가 돌아온다. X 만 보면 루프 위에 있는 박스에게도 "꺾어라" 를 내는데,
  #   그 박스는 본선 조각에 없으니 아무 일도 안 난다 (실측 2026-08-24: BOX00002 가
  #   Y -5.07 에서 45 s 대기 후 실패). 본선 롤러는 Y -773~773 이다.
  # ★ 2026-08-25: 본선 롤러가 Y ±451.6 (폭 903.2) 이다. 분기 조각 scale 1.0.
  main_line_y_mm: [-480, 480]

  # 지선 롤러가 시작하는 Y. 본선 롤러는 Y 773 에서 끝나므로 105 mm 가 빈다.
  # 가장 얕은 박스(3호 깊이 250)도 이 틈보다 두 배 이상 길어서 건너간다.
  spur_entry_y_mm: 513
  # 박스 중심이 여기를 넘으면 지선에 완전히 올라탄 것으로 보고 본선을 되돌린다.
  divert_done_y_mm: 1200

  thru_world: [-1, 0, 0]      # 평소 진행 = 월드 -X (스폰 X -409 -> 존 C X -19596)
  divert_world: [0, 1, 0]     # 꺾을 때  = 월드 +Y (지선 방향)

  # ── 소터 분류 ────────────────────────────────────────────────────────
  # ★ 켜면 `set_sorter` 로 **소터만** 꺾는다. 끄면 옛 `set_direction` 으로
  #   본선 조각 전체를 꺾는다 (A23 씬용 하위호환 — 되돌릴 수 있게 남겨 둔다).
  use_sorter: true

  # 소터 구간 (실측 bbox, `fix_test3_sorter_a47.py` 가 찍어 준 값).
  # 꺾는 동안 옆으로 밀리는 것은 **이 구간 위의 박스뿐**이다.
  # ★ 2026-08-25 재실측. 분기 조각이 scale 1.0 이 되면서 소터가 1491.7 -> **857.9**
  #   로 좁아졌다. 배타 구간이 그만큼 더 짧아진다 — 분류에는 오히려 유리하다.
  sorter_x_mm:
    A: [-8066, -7208]
    B: [-14081, -13223]
    C: [-20042, -19184]

  # ★ 소터 구간 **상류(+X)** 로 얼마나 더 비워 두고 꺾을 것인가.
  #   꺾는 동안 소터에 새로 올라타는 박스도 같이 옆으로 밀린다. 팔레트 폭 800 을
  #   0.7 m/s 로 건너는 데 약 1.14 s 걸리므로, 그 사이 들어올 수 있는 거리
  #   0.7 x 1.7 = 1190 을 잡는다. (본선은 -X 로 흐르므로 상류가 +X 쪽이다.)
  sorter_guard_mm: 1200

  # ── 리턴 라인 재순환 상한 (2026-08-26) ───────────────────────────────────
  # 존이 차 있으면 박스는 순환 루프를 한 바퀴 돌고 돌아온다(본선을 안 세운다).
  # 그런데 갈 곳이 영영 없으면 **영원히 돈다** — 장시간 실행에서 prim 이 쌓여
  # 프레임이 떨어진다. 실측 2026-08-25: N=12 · PER_PALLET=1 에서 12 개 중 8 개가
  # 동시에 루프를 돌았다 (t=165 s 로그).
  # 그래서 `max_laps` 바퀴를 채우면 `/sim/despawn_box` 로 치운다.
  # ★ CLAUDE.md §3-1 `BoxInfo.retry_count` 가 바로 이 값이다.
  max_laps: 3
  # 루프 판정선 (월드 Y). 이보다 아래로 내려가면 루프에 들어간 것으로 본다.
  # 본선 띠는 ±480, 루프 직선 `_05` 는 Y ≈ -3000 이라 그 사이면 아무 값이나 된다.
  loop_y_mm: -1500

# ── 카메라 ──────────────────────────────────────────────────────────────────
# ★ test_3 는 지선이 셋이라 픽업 하향 카메라도 셋이다. 기본값
#   `/World/CamPick/Camera` 는 test_3 에 없다 — 그대로 두면 인식(PL_CAM=1)이
#   프림을 못 찾는다.
#   ⚠ 아직 **좌표 검증 전**이다. test1-1 은 카메라가 벨트 진행축(+X)을 따라 보는데
#     test_3 는 +Y 다. `camera_pick` 의 ROI 는 축을 따라가도록 고쳐 뒀지만
#     (pickup_axis), 픽셀->mm 환산은 실측으로 확인해야 한다. 그래서 기본은 PL_CAM=0 이다.
cameras:
  pick_prim:
    A: /World/CamPick_A/Camera
    B: /World/CamPick_B/Camera
    C: /World/CamPick_C/Camera

  # ★ 스폰부 카메라 (2026-08-25 신설). 색상 판정 -> 배송지 라우팅에 쓸 자리다.
  #   위치는 `setup_test3_scene.py` [8] 이 계산한다 — 여기에 좌표를 안 박는다:
  #     X = conveyor.spawn_point_mm[0]      (스폰 지점)
  #     Y = 0                                (본선 중심. 스폰 y -66 + 지터 +-150)
  #     Z = CamPick_A 의 월드 높이           (벨트면이 같은 800 이라 시야 폭도 같다)
  #   광학값(초점거리·조리개·클리핑)도 CamPick_A 에서 복사한다. 지어내지 않는다.
  spawn_prim: /World/CamSpawn/Camera

# ── 투입 ────────────────────────────────────────────────────────────────────
boxes:
  # ★ 배송지 (QR 이 싣는 값). 크기와 **독립**으로 뽑는다.
  #   ground truth 는 프림의 `box_dest` 속성이다 — 인식이 이 값을 맞히는지 대조한다.
  #   ⚠ 실제 QR 이미지·디코딩은 아직 없다. 지금은 배송지를 씬의 ground truth 로
  #     싣고 그 값으로 라우팅한다. QR 텍스처와 판독은 트랙 D(인식) 몫이다.
  dests: ["SEOUL", "BUSAN", "DAEJEON"]

  # ★ 색표 (2026-08-25 되살림). 박스를 **배송지에 따라** 칠한다.
  #   배송지 -> 존 -> 색 은 `routing.by_dest` 와 `routing.by_color` 두 표를
  #   이어 붙여 유도한다 (SEOUL -> A -> red). 네 번째 표를 만들지 않는다 —
  #   진리원이 둘이 되면 한쪽만 고치는 사고가 난다.
  #   ⚠ 라우팅은 그대로 `by_dest` 다. 색은 **카메라가 읽을 대상**일 뿐이고,
  #     배송지는 채점용 ground truth 로 남는다 (프림의 `box_dest`).
  #   값은 채도를 최대로 둔다 — HSV 색상(H)만으로 가르려면 회색기가 없어야 한다.
  #   0.15 씩 섞여 있던 옛 값은 S 가 0.85 로 떨어져 조명에 따라 흔들린다.
  colors:
    red:   [0.90, 0.03, 0.03]
    green: [0.03, 0.70, 0.08]
    blue:  [0.03, 0.10, 0.90]

  stage1:
    # ★ 12 -> 20 s. test1-1 은 간선이 한 존 전용이라 12 s 로 충분했다.
    #   test_3 는 **세 목적지가 간선을 공유**한다. 위치변환은 그 조각 전체를
    #   옆으로 흘리므로 조각 위에 목표 박스만 있어야 하는데(§4-1), 12 s x 0.5 m/s
    #   = 6 m 간격이면 6.9 m 짜리 조각에 늘 두 개가 얹힌다.
    #   실측 2026-08-24: 꺾기 자체는 7/7 성공했는데 BOX00009·BOX00010 이 계속
    #   대기에 걸려 180 s 도착 타임아웃으로 중단됐다.
    #   20 s -> 10 m 간격 > 조각 6.9 m.
    #
    # ★ 2026-08-25: 20 -> 8 s. 소터로 바꾸면서 배타 구간이 6925 -> 1491.7 mm 가
    #   됐다. 경계 조건은 (소터 1491.7 + 상류 여유 1200) / 0.7 m/s = 3.85 s 다.
    #   8 s 는 그 두 배 남짓 — 라인이 살아 보이면서 대기가 안 쌓이는 값이다.
    spawn_interval_s: 8

# ── ROS 2 브리지 (2026-08-26 신설) ──────────────────────────────────────────
# ★ 실측으로 드러난 것: 씬에 OmniGraph 가 26 개 있는데 **전부 컨베이어**고
#   ROS2 브리지 노드가 **하나도 없었다.** /clock · /tf · 카메라 이미지를 아무도
#   안 내고 있었다 — 평가 항목 §13 "ROS2 연동 (clock · 이미지 · tf)" 이 미구현.
#   그래서 관제탑·인식 노드가 전부 구독만 한 채 영원히 기다린다 (에러는 안 난다).
ros:
  graph_path: /World/ROS2Bridge
  clock_topic: /clock
  tf:
    topic: /tf
    # 프레임 이름은 **prim 이름**이 된다 (ROS2PublishTransformTree 규칙).
    # 그래서 카메라는 `Camera` 자식이 아니라 **부모 Xform** 을 넣는다 —
    # 자식은 넷 다 이름이 `Camera` 라 프레임이 충돌한다.
    parent_prim: /World
    target_prims:
      - /World/CamSpawn
      - /World/CamPick_A
      - /World/CamPick_B
      - /World/CamPick_C
      - /World/robot_A
      - /World/robot_B
      - /World/robot_C

# ── 트럭 ──────────────────────────────────────────────────────────────
truck:
  # 1톤 트럭 적재함. 작업명세서 §3.2 가 정본이다 — 임의로 넓히면 상차가 성립 안 한다.
  bed_len_mm: 2800
  # 팔레트 자리 (월드 Y). 8501 + 800 x 3 = 10901, 3장 2400 + 여유 400.
  pallet_slot_y_mm: {A: [8501, 9301], B: [9501, 10301], C: [10501, 11301]}
  merge_width_mm: 950      # 라인 폭. 팔레트 800 + 여유 150 (피치 1000, 사이 50)

  # ★ 팔레트 가이드 벽 (2026-08-25). 합류 라인에서 팔레트가 옆으로 흔들리지 않게 잡는다.
  #
  #   ⚠ **롤러 가장자리에 붙이면 안 된다.** 합류 롤러는 784.4 인데 팔레트는 800 이라
  #     양쪽으로 각 **7.8 mm 씩 롤러 밖으로 나온다**(overhang). 롤러 가장자리(+-392.2)에
  #     세우면 가이드가 팔레트를 물어 버린다.
  #     그래서 기준을 롤러가 아니라 **팔레트 가장자리(+-400)** 로 잡고 거기서 여유를 준다.
  #
  #   지금 팔레트를 막는 것은 조각 프레임(중심 +-500)뿐이라 편도 여유가 100 mm 다 —
  #   그만큼 흔들릴 수 있다. 가이드를 세우면 편도 5 mm 로 줄어든다.
  #
  #   높이는 기존 `Rail_*` 와 같은 800~950 이다. 팔레트 몸통(800~950)만 잡고
  #   그 위 적재물(최대 1950)은 안 건드린다.
  pallet_guide:
    enabled: true
    clearance_mm: 5          # 팔레트 가장자리 바깥으로 남길 틈 (편도)
    thickness_mm: 20
    z_mm: [800, 950]
    name_fmt: /World/PalletGuide_%s_%s   # % (존, lo|hi)
