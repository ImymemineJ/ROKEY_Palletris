# Lula robot descriptor — 두산 H2017 (흡착 그리퍼 팔레타이징)
#
# 출처 URDF : ../../M0609/jik/doosan-robot2/urdf/h2017.urdf
#             (github.com/Jik-Kim/doosan-robot2, jazzy 브랜치)
# 좌표 기준 : 사양서 3-1 — 원점 z=0 은 도크 바닥. 로봇 베이스는 (600, -300, 700) mm.
#             이 파일은 로봇 로컬 프레임이므로 위 배치와는 무관하다.
#
# ⚠ M0609 descriptor 를 스케일해 만든 것이 아니다.
#   상완 0.411 -> 0.845 m, 전완 0.368 -> 0.734 m 로 링크가 약 2배라 재사용이 불가능하다.
#   collision_spheres 는 tools/gen_collision_spheres.py 가 충돌 메시에서 유도한다.
#   손으로 고치지 말고 스크립트를 고친 뒤 재생성한다.
#   검증: python3 tools/verify_spheres.py

api_version: 1.0

cspace:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

root_link: base_link
# 대기(READY) 자세. **두산로보틱스 강의자료의 값을 그대로 쓴다.**
#   READY_JOINTS_DEG = [0, 0, 90, 0, 90, 0]
#   출처: sonmiran9.oopy.io / STA 초기 세팅 문서 (M0609)
#
# H2017 에 그대로 넣어도 맞는다 (tools/fk.py 검증, 2026-08-21):
#   tool0 로컬 (+0.7340, +0.0099, +1.0681)  월드 z 1.7681
#   하강정렬 **1.0000**  ·  yaw **+180.0 deg**  ·  관절 한계 전부 통과
#
# yaw 180 이 중요하다. 컨트롤러가 주는 top-down 자세
# (`euler_angles_to_quat([0, pi, 0])`)와 **같은 값**이라, 이 자세에서 시작하면
# 손목을 돌릴 일이 0 이다. 손목이 yaw 137.5 인데 top-down 을 지령했더니 RMPflow 가
# 팔을 목표에서 1864 mm 까지 내던졌다(실측). 자세 계단 입력은 반드시 없애야 한다.
#
# ⚠ 옛 값 [0, 0.6981, 1.8326, 0, 0.6109, 0] 은 tool0 를 앞으로 뻗은 **작업 자세**였다.
#   강의의 READY 는 접어서 아래를 보는 **대기 자세**다. 성격이 다르다.
#
# ▶ 환경(A) 확정되면 여기를 다시 볼 것 — joint_1 만 돌리면 된다.
#   사양서 §5-5: "2차 컨베이어 끝단과 파렛트를 로봇 **정면** 쪽에 나란히 둔다.
#   픽<->플레이스 **40도 이내**." 180도(뒤에서 집어 앞에 놓기)는 폭 3.3 m 이유로 기각됨.
#   파렛트가 로컬 +Y(§3-1) 이므로 정면은 +Y 이고, 그때 값은
#   **[90, 0, 90, 0, 90, 90]** 이다 (joint_1 로 정면을 돌리고 joint_6 로 손목을
#   월드축에 다시 맞춘 것 — 검증 완료: 정면각 +90.8, 하강정렬 1.0000, yaw +180.0).
#   지금은 실제 컨베이어/파렛트 좌표가 없어 방향을 확정하지 않는다.
#
# ▶ 2026-08-21 **부호를 뒤집었다** — 강의 값 [0, 0, 90, 0, 90, 0] 의 미러다.
#   하강정렬 1.0000 · yaw +180 은 동일하고, 달라지는 건 두 가지다.
#
#   (1) **joint_5 부호.** 이게 결정적이다. 이 셀에서 팔이 실제로 일하는 구간의 j5 는
#       픽 -48.9, 배치 하강 -22 ~ -56 으로 **전부 음수**다. default_q 의 j5 가 +90 이면
#       cspace_target_rmp 가 j5 를 **0(손목 특이점)을 통과해** +90 쪽으로 당긴다.
#       평소엔 태스크 항에 눌려 안 보이다가, 손목이 흔들려 야코비안이 특이해지는 순간
#       이 항이 주도권을 잡는다. 실측(2026-08-21 배치 후 상승 구간):
#           j5 -28.5 -> -15.2 -> +10.8 -> +91.3   툴 기울기 3.9 -> 91.5 deg
#       손목이 통째로 뒤집혀 그리퍼가 옆으로 누웠다. -90 이면 j5 를 더 음수로,
#       즉 특이점에서 **멀어지게** 당긴다.
#   (2) tool0 가 -X 로 간다 — 현재 테스트 박스가 있는 쪽이라 시작 이동도 짧아진다.
#
#   ⚠ 이건 셀 배치에 딸린 값이다. A(환경)가 컨베이어·파렛트를 확정하면
#     **실제 작업 구간의 j5 부호를 먼저 재고** 거기에 맞춰 다시 정할 것.
default_q: [0.0, 0.0, -1.5708, 0.0, -1.5708, 0.0]

# ⚠ 위치·속도 한계는 이 파일에 적지 않는다. Lula 는 URDF 의 <limit> 에서 읽어간다.
#   descriptor 스키마에 그런 키가 없어서 여기 적으면 조용히 무시되고,
#   "제한을 넣었다"고 착각하게 된다. 아래는 h2017.urdf 값을 옮겨 적은 확인용 메모다.
#
#   joint_1  +-6.2832   vel 1.7453      joint_4  +-6.2832   vel 3.1416
#   joint_2  +-2.1817   vel 1.3963      joint_5  +-6.2832   vel 3.1416
#   joint_3  +-2.7925   vel 1.7453      joint_6  +-6.2832   vel 3.9270
#
#   joint_2 의 +-2.1817 은 M0609 에 없던 제한이다 (M0609 는 +-6.28 무제한).
#   그러므로 **m0609.urdf 를 그대로 두고 이 yaml 만 바꾸면 안 된다** — 반드시
#   h2017.urdf 를 물려야 한다. 사양서 6-3 이 경고한 지점이 여기다.
#   joint_1~3 속도가 M0609 보다 35~45% 낮으므로 사이클 타임에 M0609 측정값을
#   재사용하지 않는다 (사양서 7-3).

# 가속도/저크는 URDF 에 없다. 자중 76 kg (M0609 27 kg 의 약 2.8배)을 감안해
# M0609 값의 절반 수준에서 출발하고, Isaac 실측으로 조정한다.
acceleration_limits: [4.0, 4.0, 5.0, 8.0, 8.0, 8.0]
jerk_limits: [2000.0, 2000.0, 2500.0, 4000.0, 4000.0, 4000.0]

# cspace_to_urdf_rules 는 필요 없다 — 일반좌표가 URDF 조인트에 1:1 대응한다.

