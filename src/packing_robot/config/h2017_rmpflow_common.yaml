# RMPflow config — 두산 H2017 (흡착 팔레타이징)
#
# M0609 설정을 틀로 쓰되 H2017 수치로 갱신했다 (사양서 6-3).
# 참고한 기본 제공 설정: Isaac 5.1 의 UR10 rmpflow_suction (흡착)과
# Kawasaki rs080n (대형 산업용). 둘 다 exts/isaacsim.robot_motion.motion_generation/ 아래에 있다.
#
# ⚠ RMPflow 는 전역 경로 계획이 없다. 적재가 높아지면 이미 쌓인 박스를 돌아가지 못하고
#   국소 최소에 빠진다. 여기 게인을 아무리 만져도 해결되지 않는다.
#   반드시 경유점 방식으로 몰아야 한다 -> h2017_palletizing_controller.py

# 관절 한계에 이만큼 남기고 반발을 건다 (rad).
# joint_2 는 +-2.1817 로 좁으므로 버퍼를 더 준다. 나머지는 기본 제공 설정과 같은 0.01.
joint_limit_buffers: [0.01, 0.03, 0.02, 0.01, 0.01, 0.01]

rmp_params:
    cspace_target_rmp:
        metric_scalar: 50.
        position_gain: 100.
        damping_gain: 50.
        robust_position_term_thresh: 0.5
        inertia: 1.
    cspace_trajectory_rmp:
        p_gain: 100.
        d_gain: 10.
        ff_gain: 0.25
        weight: 50.
    cspace_affine_rmp:
        final_handover_time_std_dev: 0.25
        weight: 2000.
    joint_limit_rmp:
        metric_scalar: 1000.
        metric_length_scale: 0.01
        metric_exploder_eps: 1e-3
        metric_velocity_gate_length_scale: 0.01
        accel_damper_gain: 200.
        accel_potential_gain: 1.
        accel_potential_exploder_length_scale: 0.1
        accel_potential_exploder_eps: 1e-2
    joint_velocity_cap_rmp:
        # ⚠ 스칼라 상한이다. M0609 값 3.927 을 그대로 두면 joint_2(한계 1.3963)를
        #   초과하는 지령이 나간다. 가장 느린 관절에 맞춘다 (사양서 7-3).
        max_velocity: 1.40
        velocity_damping_region: 0.5
        damping_gain: 300.
        metric_weight: 100.
    target_rmp:
        accel_p_gain: 30.
        accel_d_gain: 85.
        accel_norm_eps: 0.075
        metric_alpha_length_scale: 0.05
        min_metric_alpha: 0.01
        max_metric_scalar: 10000
        min_metric_scalar: 2500
        proximity_metric_boost_scalar: 20.
        proximity_metric_boost_length_scale: 0.03
        xi_estimator_gate_std_dev: 20000.
        accept_user_weights: false
    axis_target_rmp:
        # 흡착은 상판에 수직으로 내려앉아야 한다. 자세 추종을 M0609 기본값보다 세게 건다.
        accel_p_gain: 300.
        accel_d_gain: 70.
        metric_scalar: 20
        proximity_metric_boost_scalar: 3000.
        proximity_metric_boost_length_scale: 0.08
        xi_estimator_gate_std_dev: 20000.
        accept_user_weights: false
    collision_rmp:
        damping_gain: 50.
        damping_std_dev: 0.04
        damping_robustness_eps: 1e-2
        damping_velocity_gate_length_scale: 0.01
        repulsion_gain: 800.
        repulsion_std_dev: 0.02
        metric_modulation_radius: 0.5
        metric_scalar: 10000.
        metric_exploder_std_dev: 0.02
        metric_exploder_eps: 0.001
    damping_rmp:
        accel_d_gain: 30.
        metric_scalar: 50.
        inertia: 100.

canonical_resolve:
    # 자중 76 kg (M0609 27 kg 의 약 2.8배). M0609 의 20 을 그대로 쓰면 과격하다.
    max_acceleration_norm: 12.
    projection_tolerance: 0.01
    verbose: false

# 로봇 자신을 원통 장애물로 두어 팔이 제 몸통을 치지 않게 한다. 로봇 베이스 프레임 기준(m).
# 치수는 h2017_collision 메시 실측값이다 (tools/gen_collision_spheres.py 와 같은 출처).
body_cylinders:
    # 받침대. 사양서 3-1 의 700 mm 위 설치 -> 베이스 아래로 0.7 m 가 구조물이다.
    # 파렛트 상면이 로봇 로컬 z = -0.55 라 팔이 받침대 옆으로 내려간다. 반드시 넣는다.
    # 받침대는 **원기둥 D400 x 700 mm** 로 확정했다 (2026-08-20). 여기 원통과 형상이
    # 정확히 일치하므로 근사 오차가 없다 -> radius = 0.20.
    #
    # 각기둥 400x400 도 검토했으나 원통으로 덮으려면 외접원 0.29 를 써야 하고,
    # 그러면 파렛트 앞변(로봇 축에서 300 mm)까지 여유가 10 mm 밖에 안 남아
    # 정면 앞변이 그리퍼 금지구역이 된다. 원기둥이 그 90 mm 를 돌려준다.
    # tools/reach_check.py 로 확인한 값 (그리퍼 150 mm · 원기둥 받침대 기준).
    # 2026-08-21 tool0 구체를 실물 치수로 고친 뒤 재측정한 값이다:
    #   파렛트 네 모서리 8지점  최소 +343 mm  (전부 도달 · 간섭 없음)
    #   3호 첫박스              +136 mm
    #   앞변 중앙 (600, 0)      **-17 mm — 간섭한다**
    #
    # ⚠ 앞변 중앙이 음수인 원인은 그리퍼가 아니라 **link_5** 다 (tool0 여유는 훨씬 크다).
    #   로봇 축에서 300 mm 밖에 안 떨어진 지점이라 손목이 받침대를 스친다.
    #   여기 반지름을 만져서 해결되지 않는다 — 받침대를 더 가늘게 하거나,
    #   파렛트 앞변 중앙 한 줄을 배치 금지구역으로 관제탑(C)에 알려야 한다.
    # 2026-08-22 기준 문서를 구 사양서로 통일하면서 **700 으로 되돌렸다**
    #   (system.yaml robot.pedestal_height_mm = 700, 구 사양서 §3-1).
    #   8/21 의 500 은 palletris 초기 세팅값이었다.
    # 이 값을 고칠 때 scripts/verify_reach.py 의 판정도 같이 다시 돌릴 것 — 같은 원통을 본다.
    - name: pedestal
      pt1: [0.0, 0.0, -0.700]
      pt2: [0.0, 0.0, 0.0]
      radius: 0.20
    # 베이스 + link_1. joint_1 축 대칭이라 회전과 무관하게 원통 하나로 덮인다.
    # 메시 실측 base_link z 0~0.221 (r 0.124), link_1 z 0.223~0.488 (r 0.128).
    - name: base_column
      pt1: [0.0, 0.0, 0.0]
      pt2: [0.0, 0.0, 0.488]
      radius: 0.14

# 위 원통과 부딪히는지 검사할 링크와 그 반지름 (m). 메시 실측 반폭 + 여유.
body_collision_controllers:
    - name: link_3
      radius: 0.08
    - name: link_4
      radius: 0.08
    - name: link_5
      radius: 0.07
    - name: link_6
      radius: 0.05
    # 흡착 그리퍼. 몸통 원기둥이 **r 0.1225** 다 (패드 테두리 0.1221 을 감싸는 치수).
    # descriptor 의 tool0 구체 6개가 만드는 반경 envelope 는 0.1242 — 여유를 줘 0.125.
    # 옛 값 0.10 은 몸통을 0.09 로 보던 시절 값이라 22 mm 샜다.
    # descriptor 의 tool0 구체와 짝이다. 한쪽만 고치지 말 것.
    #
    # ⚠ 이 항목은 **프레임 원점에 구체 하나**다. 그리퍼는 tool0 에서 0.15 m 뻗어 있는데
    #   여기엔 오프셋을 못 준다. 즉 이 값은 받침대에 대해 **플랜지 근처만** 지킨다.
    #   패드면(0.15 m 바깥)까지 받침대 회피를 걸려면 URDF 에 툴 끝 프레임을 추가하고
    #   여기에 항목을 하나 더 넣어야 한다. 도달범위 판정은 그 영향을 받지 않는다 —
    #   tools/reach_check.py 는 오프셋이 살아 있는 descriptor 구체로 계산한다.
    - name: tool0
      radius: 0.125
